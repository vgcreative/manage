                    <button type="button" className="vg-photo-remove" onClick={() => removePhoto(i)}><X size={12} /></button>
                  </div>
                ))}
                {equipForm.photos.length < MAX_EQUIPMENT_PHOTOS && (
                  <button type="button" className="vg-photo-slot vg-photo-slot--add" onClick={() => equipFileInputRef.current?.click()}>
                    <Plus size={18} />
                  </button>
                )}
                <input ref={equipFileInputRef} type="file" accept="image/*" multiple style={{ display: "none" }}
                  onChange={(e) => { addPhotos(e.target.files); e.target.value = ""; }} />
              </div>
            </Field>
            <Field label="Equipment name"><input className="vg-input" placeholder="e.g. Canon R5 + 24-70mm kit" value={equipForm.name} onChange={(e) => setEquipForm({ ...equipForm, name: e.target.value })} /></Field>
            <Field label="Category">
              <CategorySelect value={equipForm.category} builtIn={EQUIPMENT_CATEGORIES} custom={data.customCategories?.equipment} onChange={(v) => setEquipForm({ ...equipForm, category: v })} onAddCategory={(name) => addCustomCategory(mutate, "equipment", name)} onDeleteCategory={(name) => removeCustomCategory(mutate, "equipment", name)} />
            </Field>
            <div className="vg-form-row">
              <Field label="Daily rate (Ksh)"><input className="vg-input" type="number" min={0} value={equipForm.dailyRate} onChange={(e) => setEquipForm({ ...equipForm, dailyRate: e.target.value })} /></Field>
              <Field label="Serial / asset tag (optional)"><input className="vg-input" placeholder="e.g. SN-00214" value={equipForm.serial} onChange={(e) => setEquipForm({ ...equipForm, serial: e.target.value })} /></Field>
              <Field label="Availability">
                <StatusSelect value={equipForm.status} options={EQUIPMENT_STATUSES} onChange={(v) => setEquipForm({ ...equipForm, status: v })} />
              </Field>
            </div>
            <Field label="Condition / notes (optional)"><input className="vg-input" placeholder="e.g. minor scuff on strap" value={equipForm.conditionNotes} onChange={(e) => setEquipForm({ ...equipForm, conditionNotes: e.target.value })} /></Field>
            <button className="vg-btn vg-btn--gold vg-btn--block" onClick={saveEquipment}>{equipForm.id ? "Save changes" : "Add equipment"}</button>
          </div>
        )}
      </Modal>

      {/* ---------------- equipment photo lightbox ---------------- */}
      <Modal open={!!lightbox} onClose={() => setLightbox(null)} title={lightbox?.eq?.name || "Photos"} width={640} modalClassName="vg-modal--lightbox">
        {lightbox && (
          <PhotoLightbox
            photos={lightbox.eq.photos}
            index={lightbox.index}
            onIndexChange={(i) => setLightbox((l) => (l ? { ...l, index: i } : l))}
          />
        )}
      </Modal>

      {/* ---------------- new hire modal ---------------- */}
      <Modal open={hireModalOpen} onClose={() => setHireModalOpen(false)} title="New hire">
        {hireForm && (
          <div className="vg-form-grid">
            <div className="vg-filter-chips vg-filter-chips--tabs">
              <button className={`vg-chip ${clientMode === "existing" ? "vg-chip--active" : ""}`} onClick={() => setClientMode("existing")}>Existing customer</button>
              <button className={`vg-chip ${clientMode === "new" ? "vg-chip--active" : ""}`} onClick={() => setClientMode("new")}>New customer</button>
            </div>
            {clientMode === "existing" ? (
              <Field label="Customer"><ClientSelect value={hireForm.clientId} clients={data.clients} onChange={(v) => setHireForm({ ...hireForm, clientId: v })} /></Field>
            ) : (
              <div className="vg-form-row">
                <Field label="Customer name"><input className="vg-input" value={newClient.name} onChange={(e) => setNewClient({ ...newClient, name: e.target.value })} /></Field>
                <Field label="Phone"><input className="vg-input" value={newClient.phone} onChange={(e) => setNewClient({ ...newClient, phone: e.target.value })} /></Field>
                <Field label="Email"><input className="vg-input" value={newClient.email} onChange={(e) => setNewClient({ ...newClient, email: e.target.value })} /></Field>
              </div>
            )}

            <Field label="Equipment">
              {data.equipment.length === 0 ? (
                <p className="vg-form-hint">Add equipment to the catalog first.</p>
              ) : (
                <div className="vg-hire-equip-list">
                  {data.equipment.map((eq) => {
                    const item = hireForm.items.find((it) => it.equipmentId === eq.id);
                    const qty = item ? item.qty : 0;
                    const disabled = eq.status !== "available";
                    return (
                      <div className={`vg-hire-equip-row ${disabled ? "vg-hire-equip-row--disabled" : ""}`} key={eq.id}>
                        <span className="vg-hire-equip-name">{eq.name}</span>
                        <span className="vg-cell-sub">{fmtMoney(eq.dailyRate)}/day</span>
                        <StatusPill status={eq.status} />
                        <input
                          className="vg-input vg-input--qty" type="number" min={0} placeholder="0"
                          value={qty === 0 ? "" : qty} disabled={disabled}
                          onChange={(e) => setHireQty(eq.id, Math.max(0, Math.floor(Number(e.target.value)) || 0))}
                        />
                      </div>
                    );
                  })}
                </div>
              )}
            </Field>

            <div className="vg-form-row">
              <Field label="Start date"><input className="vg-input" type="date" value={hireForm.startDate} onChange={(e) => setHireForm({ ...hireForm, startDate: e.target.value })} /></Field>
              <Field label="End date"><input className="vg-input" type="date" value={hireForm.endDate} onChange={(e) => setHireForm({ ...hireForm, endDate: e.target.value })} /></Field>
              <Field label="Status">
                <StatusSelect value={hireForm.status} options={HIRE_STATUSES} onChange={(v) => setHireForm({ ...hireForm, status: v })} />
              </Field>
            </div>

            <div className="vg-pay-balance">
              <span>{hireDays(hireForm.startDate, hireForm.endDate)} day{hireDays(hireForm.startDate, hireForm.endDate) > 1 ? "s" : ""} total</span>
              <span className="vg-mono">{fmtMoney(hireTotal(hireForm, data.equipment))}</span>
            </div>

            <p className="vg-form-hint">Saving raises a full-payment invoice immediately — equipment goes out only once it's paid in full, no partial deposit.</p>

            <button className="vg-btn vg-btn--gold vg-btn--block" onClick={saveHire}>Create hire & generate invoice</button>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* =============================== PROJECTS ================================= */

const PROJECT_STATUSES = ["planning", "shooting", "editing", "completed"];
const PROJECT_PROGRESS = { planning: 25, shooting: 50, editing: 75, completed: 100 };

function ProjectsPage({ data, mutate, toast, filter, onFilterChange }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [form, setForm] = useState(null);
  const [clientMode, setClientMode] = useState("existing");
  const [newClient, setNewClient] = useState({ name: "", email: "", phone: "", type: "Individual" });
  const [localFilter, setLocalFilter] = useState(filter || "all");

  useEffect(() => { setLocalFilter(filter || "all"); }, [filter]);

  const openNew = () => {
    setForm({ id: null, title: "", clientId: data.clients[0]?.id || "", status: "planning", shootDate: todayISO(), deliveryDate: todayISO() });
    setClientMode(data.clients.length ? "existing" : "new");
    setNewClient({ name: "", email: "", phone: "", type: "Individual" });
  };

  const openEdit = (p) => {
    setForm({ ...p });
    setClientMode("existing");
    setNewClient({ name: "", email: "", phone: "", type: "Individual" });
    setModalOpen(true);
  };

  const save = () => {
    if (!form.title.trim()) { toast("Give the project a title."); return; }

    let clientId = form.clientId;
    let newClientRecord = null;
    if (!form.id && clientMode === "new") {
      if (!newClient.name.trim()) { toast("Enter the new client's name."); return; }
      clientId = uid();
      newClientRecord = { ...newClient, id: clientId, kraPin: "", source: "Referral", added: todayISO() };
    }
    if (!clientId) { toast("Pick or add a client for this project."); return; }

    if (form.id) {
      mutate((d) => ({ ...d, projects: d.projects.map((p) => p.id === form.id ? { ...form, clientId } : p) }));
      toast("Project saved");
    } else {
      mutate((d) => ({
        ...d,
        clients: newClientRecord ? [newClientRecord, ...d.clients] : d.clients,
        projects: [{ ...form, id: uid(), clientId }, ...d.projects],
      }));
      toast(newClientRecord ? "Client added to CRM and project created" : "Project created");
    }
    setModalOpen(false);
  };

  const patch = (id, patchObj) => {
    mutate((d) => ({ ...d, projects: d.projects.map((p) => p.id === id ? { ...p, ...patchObj } : p) }));
  };

  const remove = (p) => {
    if (!window.confirm(`Delete project "${p.title}"? This can't be undone.`)) return;
    mutate((d) => ({ ...d, projects: d.projects.filter((x) => x.id !== p.id) }));
    toast("Project deleted");
  };

  const setFilter = (v) => { setLocalFilter(v); onFilterChange && onFilterChange(v); };

  const visibleProjects = useMemo(() => {
    if (localFilter === "active") return data.projects.filter((p) => p.status !== "completed");
    if (localFilter === "completed") return data.projects.filter((p) => p.status === "completed");
    return data.projects;
  }, [data.projects, localFilter]);

  return (
    <div className="vg-page">
      <PageHeader title="Projects" subtitle="Track every production from planning to delivery"
        action={<button className="vg-btn vg-btn--gold" onClick={() => { openNew(); setModalOpen(true); }}><Plus size={16} />New project</button>} />

      <div className="vg-filter-chips">
        {[["all", "All"], ["active", "Active"], ["completed", "Completed"]].map(([v, label]) => (
          <button key={v} className={`vg-chip ${localFilter === v ? "vg-chip--active" : ""}`} onClick={() => setFilter(v)}>{label}</button>
        ))}
      </div>

      {visibleProjects.length === 0 ? (
        <div className="vg-card vg-card--grow"><EmptyState icon={FolderKanban} title="No projects yet" body="Projects appear once a booking moves into production." actionLabel="New project" onAction={() => { openNew(); setModalOpen(true); }} /></div>
      ) : (
        <div className="vg-project-grid">
          {visibleProjects.map((p) => {
            const client = data.clients.find((c) => c.id === p.clientId);
            return (
              <div className="vg-card vg-project-card" key={p.id}>
                <div className="vg-project-head">
                  <div>
                    <div className="vg-project-title">{p.title}</div>
                    <div className="vg-cell-sub">{client ? client.name : "—"}</div>
                  </div>
                  <div className="vg-project-head-right">
                    <StatusPill status={p.status} />
                    <button className="vg-icon-btn" title="Edit project" onClick={() => openEdit(p)}><Pencil size={15} /></button>
                    <button className="vg-icon-btn vg-icon-btn--danger" title="Delete project" onClick={() => remove(p)}><Trash2 size={15} /></button>
                  </div>
                </div>
                <div className="vg-project-dates">
                  <span>Shoot {fmtDate(p.shootDate)}</span>
                  <span className="vg-dot-sep">·</span>
                  <span>Delivery {fmtDate(p.deliveryDate)}</span>
                </div>

                <div className="vg-progress-head">
                  <span>Progress</span>
                  <span className="vg-mono">{PROJECT_PROGRESS[p.status]}%</span>
                </div>
                <div className="vg-progress-track">
                  <div className="vg-progress-fill" style={{ width: `${PROJECT_PROGRESS[p.status]}%` }} />
                  <div className="vg-progress-ticks">
                    {Array.from({ length: 20 }).map((_, i) => <span key={i} />)}
                  </div>
                </div>

                <div className="vg-project-controls">
                  <StatusSelect value={p.status} options={PROJECT_STATUSES} onChange={(v) => patch(p.id, { status: v })} />
                </div>
              </div>
            );
          })}
        </div>
      )}

      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={form?.id ? "Edit project" : "New project"}>
        {form && (
          <div className="vg-form-grid">
            <Field label="Title"><input className="vg-input" value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} /></Field>

            {!form.id && (
              <div className="vg-filter-chips vg-filter-chips--tabs">
                <button className={`vg-chip ${clientMode === "existing" ? "vg-chip--active" : ""}`} onClick={() => setClientMode("existing")}>Existing client</button>
                <button className={`vg-chip ${clientMode === "new" ? "vg-chip--active" : ""}`} onClick={() => setClientMode("new")}>New client</button>
              </div>
            )}

            {(form.id || clientMode === "existing") ? (
              <Field label="Client">
                <ClientSelect value={form.clientId} clients={data.clients} onChange={(v) => setForm({ ...form, clientId: v })} />
              </Field>
            ) : (
              <>
                <Field label="Client name"><input className="vg-input" placeholder="Full name or company" value={newClient.name} onChange={(e) => setNewClient({ ...newClient, name: e.target.value })} /></Field>
                <Field label="Type">
                  <StatusSelect value={newClient.type} options={["Individual", "Company"]} onChange={(v) => setNewClient({ ...newClient, type: v })} />
                </Field>
                <Field label="Email"><input className="vg-input" value={newClient.email} onChange={(e) => setNewClient({ ...newClient, email: e.target.value })} /></Field>
                <Field label="Phone"><input className="vg-input" value={newClient.phone} onChange={(e) => setNewClient({ ...newClient, phone: e.target.value })} /></Field>
                <p className="vg-form-hint">This client will be added to your CRM automatically when you create the project.</p>
              </>
            )}

            <Field label="Shoot date"><input className="vg-input" type="date" value={form.shootDate} onChange={(e) => setForm({ ...form, shootDate: e.target.value })} /></Field>
            <Field label="Delivery date"><input className="vg-input" type="date" value={form.deliveryDate} onChange={(e) => setForm({ ...form, deliveryDate: e.target.value })} /></Field>
            <button className="vg-btn vg-btn--gold vg-btn--block" onClick={save}>{form.id ? "Save changes" : "Create project"}</button>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ================================ EXPENSES ================================= */
/* Job costs — gear hire, crew, transport, location fees — so the dashboard
   can show actual profit (revenue collected minus what a shoot cost) rather
   than treating "revenue collected" as if it were profit. */

const EXPENSE_CATEGORIES = ["Gear hire", "Crew", "Transport", "Location"];
const blankExpense = () => ({ id: null, category: "Gear hire", description: "", amount: "", date: todayISO(), projectId: "" });

function ProjectSelect({ value, projects, onChange }) {
  return (
    <div className="vg-select-wrap">
      <select className="vg-select" value={value || ""} onChange={(e) => onChange(e.target.value)}>
        <option value="">No linked project</option>
        {projects.map((p) => (
          <option key={p.id} value={p.id}>{p.title}</option>
        ))}
      </select>
      <ChevronDown size={15} className="vg-select-chevron" />
    </div>
  );
}

function ExpensesPage({ data, mutate, toast }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [form, setForm] = useState(null);
  const [categoryFilter, setCategoryFilter] = useState("all");

  const openNew = () => { setForm(blankExpense()); setModalOpen(true); };
  const openEdit = (e) => { setForm({ ...e, amount: String(e.amount) }); setModalOpen(true); };

  const save = () => {
    const amount = Number(form.amount);
    if (!form.description.trim()) { toast("Add a short description for this cost."); return; }
    if (!amount || amount <= 0) { toast("Enter an amount for this cost."); return; }
    const clean = { ...form, amount };
    if (form.id) {
      mutate((d) => ({ ...d, expenses: d.expenses.map((x) => x.id === form.id ? clean : x) }));
      toast("Expense updated");
    } else {
      mutate((d) => ({ ...d, expenses: [{ ...clean, id: uid() }, ...d.expenses] }));
      toast("Expense logged");
    }
    setModalOpen(false);
  };

  const remove = (e) => {
    if (!window.confirm(`Delete this expense (${e.description})? This can't be undone.`)) return;
    mutate((d) => ({ ...d, expenses: d.expenses.filter((x) => x.id !== e.id) }));
    toast("Expense deleted");
  };

  const visibleExpenses = useMemo(() => {
    if (categoryFilter === "all") return data.expenses;
    return data.expenses.filter((e) => e.category === categoryFilter);
  }, [data.expenses, categoryFilter]);

  const stats = useMemo(() => {
    const totalCost = data.expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
    const revenueCollected = data.invoices.reduce((s, i) => s + Number(i.paid || 0), 0);
    const netProfit = revenueCollected - totalCost;
    const allCategories = [...EXPENSE_CATEGORIES, ...(data.customCategories?.expense || [])];
    const byCategory = allCategories.map((cat) => ({
      cat, value: data.expenses.filter((e) => e.category === cat).reduce((s, e) => s + Number(e.amount || 0), 0),
    })).filter((c) => c.value > 0);
    return { totalCost, revenueCollected, netProfit, byCategory };
  }, [data.expenses, data.invoices, data.customCategories]);

  return (
    <div className="vg-page">
      <PageHeader title="Expenses" subtitle="Gear hire, crew and transport — what shoots actually cost"
        action={<button className="vg-btn vg-btn--gold" onClick={openNew}><Plus size={16} />Log expense</button>} />

      <div className="vg-kpi-grid">
        <div className="vg-card vg-kpi">
          <div className="vg-kpi-top">
            <span className="vg-kpi-label">Revenue collected</span>
            <span className="vg-kpi-icon vg-kpi-icon--gold"><Coins size={16} strokeWidth={1.8} /></span>
          </div>
          <div className="vg-kpi-value">{fmtMoney(stats.revenueCollected)}</div>
        </div>
        <div className="vg-card vg-kpi">
          <div className="vg-kpi-top">
            <span className="vg-kpi-label">Total costs</span>
            <span className="vg-kpi-icon vg-kpi-icon--warn"><Receipt size={16} strokeWidth={1.8} /></span>
          </div>
          <div className="vg-kpi-value">{fmtMoney(stats.totalCost)}</div>
        </div>
        <div className="vg-card vg-kpi">
          <div className="vg-kpi-top">
            <span className="vg-kpi-label">Net profit</span>
            <span className={`vg-kpi-icon ${stats.netProfit >= 0 ? "vg-kpi-icon--gold" : "vg-kpi-icon--danger"}`}><PiggyBank size={16} strokeWidth={1.8} /></span>
          </div>
          <div className="vg-kpi-value">{fmtMoney(stats.netProfit)}</div>
        </div>
      </div>

      {stats.byCategory.length > 0 && (
        <div className="vg-card">
          <div className="vg-card-head"><h3>Costs by category</h3></div>
          <div className="vg-legend">
            {stats.byCategory.map((c) => (
              <div className="vg-legend-row" key={c.cat}>
                <span className="vg-legend-dot" style={{ background: "var(--c-gold)" }} />
                <span className="vg-legend-name">{c.cat}</span>
                <span className="vg-legend-val">{fmtMoney(c.value)}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="vg-filter-chips">
        {[["all", "All"], ...EXPENSE_CATEGORIES.map((c) => [c, c]), ...(data.customCategories?.expense || []).map((c) => [c, c])].map(([v, label]) => (
          <button key={v} className={`vg-chip ${categoryFilter === v ? "vg-chip--active" : ""}`} onClick={() => setCategoryFilter(v)}>{label}</button>
        ))}
      </div>

      <div className="vg-card vg-card--grow">
        <div className="vg-card-head"><h3>All expenses ({visibleExpenses.length})</h3></div>
        {visibleExpenses.length === 0 ? (
          <EmptyState icon={Receipt} title="No costs logged yet" body="Log gear hire, crew pay or transport so the dashboard can show real profit, not just revenue." actionLabel="Log expense" onAction={openNew} />
        ) : (
          <div className="vg-table">
            <div className="vg-tr vg-tr--head vg-tr--expenses">
              <div className="vg-td">Date</div>
              <div className="vg-td">Category</div>
              <div className="vg-td vg-td--wide">Description</div>
              <div className="vg-td vg-td--wide">Project</div>
              <div className="vg-td">Amount</div>
              <div className="vg-td vg-td--actions" />
            </div>
            {visibleExpenses.map((e) => {
              const project = data.projects.find((p) => p.id === e.projectId);
              return (
                <div className="vg-tr vg-tr--expenses" key={e.id}>
                  <div className="vg-td">{fmtDate(e.date)}</div>
                  <div className="vg-td"><span className="vg-chip vg-chip--static">{e.category}</span></div>
                  <div className="vg-td vg-td--wide">{e.description}</div>
                  <div className="vg-td vg-td--wide">{project ? project.title : "—"}</div>
                  <div className="vg-td vg-mono vg-amount">{fmtMoney(e.amount)}</div>
                  <div className="vg-td vg-td--actions">
                    <button className="vg-icon-btn" title="Edit expense" onClick={() => openEdit(e)}><Pencil size={15} /></button>
                    <button className="vg-icon-btn vg-icon-btn--danger" title="Delete expense" onClick={() => remove(e)}><Trash2 size={15} /></button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={form?.id ? "Edit expense" : "Log expense"}>
        {form && (
          <div className="vg-form-grid">
            <Field label="Category">
              <CategorySelect value={form.category} builtIn={EXPENSE_CATEGORIES} custom={data.customCategories?.expense} onChange={(v) => setForm({ ...form, category: v })} onAddCategory={(name) => addCustomCategory(mutate, "expense", name)} onDeleteCategory={(name) => removeCustomCategory(mutate, "expense", name)} />
            </Field>
            <Field label="Description"><input className="vg-input" placeholder="e.g. Gimbal hire — Otieno wedding" value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} /></Field>
            <Field label="Amount"><input className="vg-input" type="number" placeholder="0" value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} /></Field>
            <Field label="Date"><input className="vg-input" type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
            <Field label="Linked project (optional)">
              <ProjectSelect value={form.projectId} projects={data.projects} onChange={(v) => setForm({ ...form, projectId: v })} />
            </Field>
            <button className="vg-btn vg-btn--gold vg-btn--block" onClick={save}>{form.id ? "Save changes" : "Log expense"}</button>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* =============================== QUOTATIONS ================================ */

const blankItem = () => ({ id: uid(), description: "", qty: 1, price: "" });
const QUICK_ITEMS = [
  { label: "Camera", description: "Camera hire" },
  { label: "Lighting", description: "Lighting equipment" },
  { label: "Labour", description: "Crew / labour" },
];

function QuotationsPage({ data, mutate, toast }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [form, setForm] = useState(null);
  const [clientMode, setClientMode] = useState("existing");
  const [newClient, setNewClient] = useState(blankNewClient());

  const openNew = () => {
    setForm({ id: null, clientId: data.clients[0]?.id || "", validUntil: todayISO(), notes: "", items: [blankItem()] });
    setClientMode(data.clients.length ? "existing" : "new");
    setNewClient(blankNewClient());
    setModalOpen(true);
  };

  const openEdit = (q) => {
    setForm({ id: q.id, clientId: q.clientId, validUntil: q.validUntil, notes: q.notes || "", items: q.items.length ? q.items.map((it) => ({ ...it, id: it.id || uid() })) : [blankItem()] });
    setClientMode("existing");
    setNewClient(blankNewClient());
    setModalOpen(true);
  };

  const setItem = (id, patch) => setForm((f) => ({ ...f, items: f.items.map((it) => it.id === id ? { ...it, ...patch } : it) }));
  const addItem = (description = "") => setForm((f) => ({ ...f, items: [...f.items, { ...blankItem(), description }] }));
  const removeItem = (id) => setForm((f) => ({ ...f, items: f.items.length > 1 ? f.items.filter((it) => it.id !== id) : f.items }));

  const formTotal = useMemo(() => {
    if (!form) return 0;
    return form.items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
  }, [form]);

  const create = () => {
    let clientId = form.clientId;
    let newClientRecord = null;
    if (clientMode === "new") {
      if (!newClient.name.trim()) { toast("Enter the new client's name."); return; }
      clientId = uid();
      newClientRecord = { ...newClient, id: clientId, source: "Referral", added: todayISO() };
    }
    if (!clientId) { toast("Pick or add a client to create a quote."); return; }
    const items = form.items.filter((it) => it.description.trim() && Number(it.price) > 0);
    if (items.length === 0) { toast("Add at least one line item with an amount."); return; }
    const cleanItems = items.map((it) => ({ ...it, qty: Number(it.qty) || 1, price: Number(it.price) || 0 }));
    const total = cleanItems.reduce((s, it) => s + it.qty * it.price, 0);

    if (form.id) {
      mutate((d) => ({
        ...d,
        clients: newClientRecord ? [newClientRecord, ...d.clients] : d.clients,
        quotations: d.quotations.map((q) => q.id === form.id ? { ...q, clientId, items: cleanItems, total, validUntil: form.validUntil, notes: form.notes } : q),
      }));
      toast(newClientRecord ? "Client added to CRM and quotation saved" : "Quotation saved");
      setModalOpen(false);
      return;
    }

    mutate((d) => {
      const number = `VGQ-${String(d.quoteSeq).padStart(6, "0")}`;
      return {
        ...d,
        quoteSeq: d.quoteSeq + 1,
        clients: newClientRecord ? [newClientRecord, ...d.clients] : d.clients,
        quotations: [{ id: uid(), number, clientId, items: cleanItems, total, validUntil: form.validUntil, notes: form.notes, status: "draft" }, ...d.quotations],
      };
    });
    toast(newClientRecord ? "Client added to CRM and quotation created" : "Quotation created");
    setModalOpen(false);
  };

  const acceptQuote = (q) => {
    mutate((d) => {
      const client = d.clients.find((c) => c.id === q.clientId);
      const bookingId = uid();
      const eventTitle = (q.items && q.items[0]?.description) || `Booking — ${client ? client.name : "Client"}`;
      const booking = {
        id: bookingId, event: eventTitle, category: "Custom", clientId: q.clientId,
        startDate: todayISO(), endDate: todayISO(), location: "", status: "confirmed", gearIds: [], packageId: "",
        quotationId: q.id,
      };
      const invoiceId = uid();
      const number = `VGI-${String(d.invoiceSeq).padStart(6, "0")}`;
      const invoice = {
        id: invoiceId, number, clientId: q.clientId, total: q.total, paid: 0,
        date: todayISO(), dueDate: todayISO(), items: q.items, notes: q.notes,
        status: "unpaid", sent: false, quotationId: q.id, bookingId,
      };
      const project = makeProjectFromInvoice({
        client, title: `${eventTitle}${client ? ` — ${client.name}` : ""}`,
        shootDate: todayISO(), invoiceId, bookingId, quotationId: q.id,
      });
      return {
        ...d,
        invoiceSeq: d.invoiceSeq + 1,
        bookings: [booking, ...d.bookings],
        invoices: [invoice, ...d.invoices],
        projects: [project, ...d.projects],
        quotations: d.quotations.map((x) => x.id === q.id ? { ...x, status: "invoiced", bookingId, invoiceId } : x),
      };
    });
    toast(`${q.number} accepted — booking, invoice and project created`);
  };

  const download = (q) => {
    const client = data.clients.find((c) => c.id === q.clientId);
    const html = buildDocHTML({
      docType: "Quotation",
      number: q.number,
      statusLabel: effectiveQuoteStatus(q),
      dateLabel: "Valid until",
      dateValue: fmtDate(q.validUntil),
      client,
      items: q.items || [],
      notes: q.notes,
      totals: [{ label: "Total", value: fmtMoney(q.total), strong: true }],
    });
    downloadDocument(html, `Quotation-${q.number}.html`);
    toast("Quotation downloaded — open it and use Print > Save as PDF");
  };

  const remove = (q) => {
    if (!window.confirm(`Delete quotation ${q.number}? This can't be undone.`)) return;
    mutate((d) => ({ ...d, quotations: d.quotations.filter((x) => x.id !== q.id) }));
    toast("Quotation deleted");
  };

  const quoteStats = useMemo(() => {
    const draft = data.quotations.filter((q) => q.status === "draft").length;
    const accepted = data.quotations.filter((q) => q.status === "accepted").length;
    const invoiced = data.quotations.filter((q) => q.status === "invoiced").length;
    const pipelineValue = data.quotations.filter((q) => q.status !== "invoiced").reduce((s, q) => s + q.total, 0);
    const expired = data.quotations.filter(isQuoteExpired).length;
    return { draft, accepted, invoiced, pipelineValue, expired };
  }, [data.quotations]);

  return (
    <div className="vg-page">
      <PageHeader title="Quotations" subtitle="Itemised proposals, approvals and conversions"
        action={<button className="vg-btn vg-btn--gold" onClick={openNew}><Plus size={15} />New quotation</button>} />

      <div className="vg-kpi-grid">
        <div className="vg-card vg-kpi">
          <div className="vg-kpi-top">
            <span className="vg-kpi-label">Draft</span>
            <span className="vg-kpi-icon vg-kpi-icon--plain"><Clock3 size={16} strokeWidth={1.8} /></span>
          </div>
          <div className="vg-kpi-value">{quoteStats.draft}</div>
        </div>
        <div className="vg-card vg-kpi">
          <div className="vg-kpi-top">
            <span className="vg-kpi-label">Accepted</span>
            <span className="vg-kpi-icon vg-kpi-icon--gold"><CheckCircle2 size={16} strokeWidth={1.8} /></span>
          </div>
          <div className="vg-kpi-value">{quoteStats.accepted}</div>
        </div>
        <div className="vg-card vg-kpi">
          <div className="vg-kpi-top">
            <span className="vg-kpi-label">Invoiced</span>
            <span className="vg-kpi-icon vg-kpi-icon--plain"><FileText size={16} strokeWidth={1.8} /></span>
          </div>
          <div className="vg-kpi-value">{quoteStats.invoiced}</div>
        </div>
        <div className="vg-card vg-kpi">
          <div className="vg-kpi-top">
            <span className="vg-kpi-label">Pipeline value</span>
            <span className="vg-kpi-icon vg-kpi-icon--gold"><Coins size={16} strokeWidth={1.8} /></span>
          </div>
          <div className="vg-kpi-value">{fmtMoney(quoteStats.pipelineValue)}</div>
        </div>
        <div className="vg-card vg-kpi">
          <div className="vg-kpi-top">
            <span className="vg-kpi-label">Expired</span>
            <span className="vg-kpi-icon vg-kpi-icon--danger"><AlertTriangle size={16} strokeWidth={1.8} /></span>
          </div>
          <div className="vg-kpi-value">{quoteStats.expired}</div>
        </div>
      </div>

      <div className="vg-card vg-card--grow">
        <div className="vg-card-head"><h3>All quotations ({data.quotations.length})</h3></div>
        {data.quotations.length === 0 ? (
          <EmptyState icon={FileText} title="No quotations yet" body="Draft a proposal for a client to start the paper trail." actionLabel="New quotation" onAction={openNew} />
        ) : (
          <div className="vg-table">
            <div className="vg-tr vg-tr--head vg-tr--quotations">
              <div className="vg-td">Number</div>
              <div className="vg-td vg-td--wide">Client</div>
              <div className="vg-td">Total</div>
              <div className="vg-td">Valid until</div>
              <div className="vg-td">Status</div>
              <div className="vg-td vg-td--actions-wide">Actions</div>
            </div>
            {data.quotations.map((q) => {
              const client = data.clients.find((c) => c.id === q.clientId);
              return (
                <div className="vg-tr vg-tr--quotations" key={q.id}>
                  <div className="vg-td vg-mono">{q.number}</div>
                  <div className="vg-td vg-td--wide">{client ? client.name : "—"}</div>
                  <div className="vg-td vg-mono vg-amount">{fmtMoney(q.total)}</div>
                  <div className="vg-td">{fmtDate(q.validUntil)}</div>
                  <div className="vg-td">
                    <StatusPill status={effectiveQuoteStatus(q)} />
                    {isQuoteExpired(q) && <div className="vg-cell-sub vg-cell-sub--danger">{daysBetween(q.validUntil)}d expired</div>}
                  </div>
                  <div className="vg-td vg-td--actions-wide">
                    <button className="vg-btn vg-btn--sm" onClick={() => download(q)}><Download size={13} />Download</button>
                    {q.status === "draft" && <button className="vg-btn vg-btn--sm" onClick={() => acceptQuote(q)}>Accept</button>}
                    <button className="vg-btn vg-btn--sm vg-btn--gold" disabled={q.status === "invoiced"} onClick={() => acceptQuote(q)}>
                      {q.status === "invoiced" ? "Invoiced" : "To invoice"}
                    </button>
                    <button className="vg-icon-btn" title="Edit quotation" onClick={() => openEdit(q)}><Pencil size={15} /></button>
                    <button className="vg-icon-btn vg-icon-btn--danger" title="Delete quotation" onClick={() => remove(q)}><Trash2 size={15} /></button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={form?.id ? "Edit quotation" : "New quotation"} width={620}>
        {form && (
          <div className="vg-form-grid">
            <ClientPicker
              clients={data.clients}
              mode={clientMode}
              onModeChange={setClientMode}
              clientId={form.clientId}
              onClientIdChange={(v) => setForm({ ...form, clientId: v })}
              newClient={newClient}
              onNewClientChange={setNewClient}
            />
            {clientMode === "new" && <p className="vg-form-hint">This client will be added to your CRM automatically when you save.</p>}
            <Field label="Valid until"><input className="vg-input" type="date" value={form.validUntil} onChange={(e) => setForm({ ...form, validUntil: e.target.value })} /></Field>

            <div className="vg-field-label" style={{ marginTop: 4 }}>Quick add</div>
            <div className="vg-filter-chips vg-filter-chips--tabs">
              {QUICK_ITEMS.map((qi) => (
                <button key={qi.label} type="button" className="vg-chip" onClick={() => addItem(qi.description)}>+ {qi.label}</button>
              ))}
              <button type="button" className="vg-chip" onClick={() => addItem("")}>+ Custom item</button>
            </div>

            <div className="vg-field-label" style={{ marginTop: 4 }}>Line items</div>
            <div className="vg-items">
              <div className="vg-items-head">
                <span>Item</span><span>From package</span><span>Qty</span><span>Amount</span><span></span>
              </div>
              {form.items.map((it) => (
                <div className="vg-items-row" key={it.id}>
                  <input className="vg-input" placeholder="Description" value={it.description} onChange={(e) => setItem(it.id, { description: e.target.value })} />
                  <div className="vg-select-wrap">
                    <select className="vg-select" value="" onChange={(e) => {
                      const pkg = data.packages.find((s) => s.id === e.target.value);
                      if (pkg) setItem(it.id, { description: pkg.name, price: pkg.price, qty: 1 });
                    }}>
                      <option value="">Select…</option>
                      {data.packages.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                    <ChevronDown size={14} className="vg-select-chevron" />
                  </div>
                  <input className="vg-input vg-input--num" type="number" min={1} value={it.qty} onChange={(e) => setItem(it.id, { qty: e.target.value })} />
                  <input className="vg-input" type="number" placeholder="0" value={it.price} onChange={(e) => setItem(it.id, { price: e.target.value })} />
                  <button className="vg-icon-btn vg-icon-btn--danger" onClick={() => removeItem(it.id)}><Trash2 size={14} /></button>
                </div>
              ))}
            </div>
            <button className="vg-btn vg-btn--ghost vg-btn--sm" style={{ alignSelf: "flex-start" }} onClick={() => addItem("")}><Plus size={14} />Add line</button>

            <Field label="Notes (optional)"><input className="vg-input" placeholder="Terms, inclusions, exclusions…" value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} /></Field>

            <div className="vg-pay-balance">
              <span>Quotation total</span>
              <strong className="vg-mono vg-amount">{fmtMoney(formTotal)}</strong>
            </div>

            <button className="vg-btn vg-btn--gold vg-btn--block" onClick={create}>{form.id ? "Save changes" : "Create quotation"}</button>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ============================ INVOICES & PAYMENTS ========================== */

function InvoicesPage({ data, mutate, toast, filter, onFilterChange }) {
  const [payModal, setPayModal] = useState(null);
  const [payForm, setPayForm] = useState({ amount: "", date: todayISO(), note: "" });
  const [newModal, setNewModal] = useState(false);
  const [editingInvoiceId, setEditingInvoiceId] = useState(null);
  const [viewInvoice, setViewInvoice] = useState(null);
  const [form, setForm] = useState(null);
  const [localFilter, setLocalFilter] = useState(filter || "all");
  const [editPayModal, setEditPayModal] = useState(null);
  const [editPayForm, setEditPayForm] = useState({ amount: "", date: todayISO(), note: "" });
  const [clientMode, setClientMode] = useState("existing");
  const [newClient, setNewClient] = useState(blankNewClient());

  useEffect(() => { setLocalFilter(filter || "all"); }, [filter]);
  const setFilter = (v) => { setLocalFilter(v); onFilterChange && onFilterChange(v); };

  const visibleInvoices = useMemo(() => {
    if (localFilter === "all") return data.invoices;
    if (localFilter === "outstanding") return data.invoices.filter((i) => i.total - i.paid > 0);
    if (localFilter === "overdue") return data.invoices.filter(isInvoiceOverdue);
    return data.invoices.filter((i) => i.status === localFilter);
  }, [data.invoices, localFilter]);

  const openPay = (inv) => { setPayModal(inv); setPayForm({ amount: "", date: todayISO(), note: "" }); };

  const openNewInvoice = () => {
    setEditingInvoiceId(null);
    setForm({
      clientId: data.clients[0]?.id || "",
      date: todayISO(),
      dueDate: todayISO(),
      notes: "",
      items: [blankItem()],
    });
    setClientMode(data.clients.length ? "existing" : "new");
    setNewClient(blankNewClient());
    setNewModal(true);
  };

  const openEditInvoice = (inv) => {
    setEditingInvoiceId(inv.id);
    setForm({
      clientId: inv.clientId,
      date: inv.date,
      dueDate: inv.dueDate || "",
      notes: inv.notes || "",
      items: (inv.items && inv.items.length ? inv.items : [blankItem()]).map((it) => ({ ...it })),
    });
    setClientMode("existing");
    setNewClient(blankNewClient());
    setNewModal(true);
  };

  const setItem = (id, patch) => setForm((f) => ({ ...f, items: f.items.map((it) => it.id === id ? { ...it, ...patch } : it) }));
  const addItem = () => setForm((f) => ({ ...f, items: [...f.items, blankItem()] }));
  const removeItem = (id) => setForm((f) => ({ ...f, items: f.items.length > 1 ? f.items.filter((it) => it.id !== id) : f.items }));

  const formTotal = useMemo(() => {
    if (!form) return 0;
    return form.items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
  }, [form]);

  const pickPackage = (itemId, packageId) => {
    const pkg = data.packages.find((s) => s.id === packageId);
    if (!pkg) return;
    setItem(itemId, { description: pkg.name, price: pkg.price, qty: 1 });
  };

  const createInvoice = () => {
    let clientId = form.clientId;
    let newClientRecord = null;
    if (clientMode === "new") {
      if (!newClient.name.trim()) { toast("Enter the new client's name."); return; }
      clientId = uid();
      newClientRecord = { ...newClient, id: clientId, source: "Referral", added: todayISO() };
    }
    if (!clientId) { toast("Pick or add a client for this invoice."); return; }
    const items = form.items.filter((it) => it.description.trim() && Number(it.price) > 0);
    if (items.length === 0) { toast("Add at least one line item with a price."); return; }
    const cleanItems = items.map((it) => ({ ...it, qty: Number(it.qty) || 1, price: Number(it.price) || 0 }));

    if (editingInvoiceId) {
      mutate((d) => ({
        ...d,
        invoices: d.invoices.map((inv) => {
          if (inv.id !== editingInvoiceId) return inv;
          const paid = Math.min(inv.paid, formTotal);
          const status = paid >= formTotal ? "paid" : paid > 0 ? "partial" : "unpaid";
          return { ...inv, clientId, date: form.date, dueDate: form.dueDate, notes: form.notes, items: cleanItems, total: formTotal, paid, status };
        }),
      }));
      toast("Invoice updated");
      setNewModal(false);
      setEditingInvoiceId(null);
      return;
    }

    mutate((d) => {
      const number = `VGI-${String(d.invoiceSeq).padStart(6, "0")}`;
      const invoice = {
        id: uid(), number, clientId, total: formTotal, paid: 0,
        date: form.date, dueDate: form.dueDate, notes: form.notes,
        items: cleanItems,
        status: "unpaid", sent: false,
      };
      return {
        ...d,
        invoiceSeq: d.invoiceSeq + 1,
        clients: newClientRecord ? [newClientRecord, ...d.clients] : d.clients,
        invoices: [invoice, ...d.invoices],
      };
    });
    toast(newClientRecord ? "Client added to CRM and invoice generated" : "Invoice generated");
    setNewModal(false);
  };

  const recordPayment = () => {
    const amt = Number(payForm.amount);
    if (!amt || amt <= 0) { toast("Enter an amount to record."); return; }
    const invoice = data.invoices.find((i) => i.id === payModal.id);
    if (!invoice) return;
    const receipt = `VGR-${String(data.receiptSeq).padStart(6, "0")}`;
    const newPaid = Math.min(invoice.total, invoice.paid + amt);
    const status = newPaid >= invoice.total ? "paid" : newPaid > 0 ? "partial" : "unpaid";
    const paidPct = invoice.total > 0 ? newPaid / invoice.total : 0;
    mutate((d) => ({
      ...d,
      receiptSeq: d.receiptSeq + 1,
      invoices: d.invoices.map((i) => i.id === payModal.id ? { ...i, paid: newPaid, status } : i),
      projects: syncProjectWithPayment(d.projects, payModal.id, paidPct),
      payments: [{ id: uid(), receipt, clientId: invoice.clientId, invoiceId: invoice.id, date: payForm.date, note: payForm.note || "Payment received", amount: amt }, ...d.payments],
    }));
    const client = data.clients.find((c) => c.id === invoice.clientId);
    const html = buildReceiptHTML({
      receiptNumber: receipt,
      date: payForm.date,
      client,
      invoiceNumber: invoice.number,
      amountPaid: amt,
      invoiceTotal: invoice.total,
      paidToDate: newPaid,
      balanceRemaining: invoice.total - newPaid,
      method: payForm.note,
      items: invoice.items,
    });
    downloadDocument(html, `Receipt-${receipt}.html`);
    toast(
      status === "paid" ? "Payment recorded — invoice paid, project marked complete"
      : paidPct >= 0.5 ? "Payment recorded — 50%+ paid, project moved to shooting"
      : "Payment recorded — receipt downloaded"
    );
    setPayModal(null);
  };

  const openEditPay = (p) => { setEditPayModal(p); setEditPayForm({ amount: String(p.amount), date: p.date, note: p.note || "" }); };

  const recalcInvoiceStatus = (invoice) => {
    const status = invoice.paid >= invoice.total ? "paid" : invoice.paid > 0 ? "partial" : "unpaid";
    return { ...invoice, status };
  };

  const saveEditPayment = () => {
    const amt = Number(editPayForm.amount);
    if (!amt || amt <= 0) { toast("Enter an amount to record."); return; }
    mutate((d) => {
      const original = d.payments.find((p) => p.id === editPayModal.id);
      if (!original) return d;
      const invoice = d.invoices.find((i) => i.id === original.invoiceId);
      let invoices = d.invoices;
      let projects = d.projects;
      if (invoice) {
        const newPaid = Math.max(0, Math.min(invoice.total, invoice.paid - original.amount + amt));
        const updated = recalcInvoiceStatus({ ...invoice, paid: newPaid });
        invoices = d.invoices.map((i) => i.id === invoice.id ? updated : i);
        const paidPct = updated.total > 0 ? updated.paid / updated.total : 0;
        projects = syncProjectWithPayment(d.projects, invoice.id, paidPct);
      }
      return {
        ...d,
        invoices,
        projects,
        payments: d.payments.map((p) => p.id === original.id ? { ...p, amount: amt, date: editPayForm.date, note: editPayForm.note || "Payment received" } : p),
      };
    });
    toast("Payment updated");
    setEditPayModal(null);
  };

  const removePayment = (p) => {
    if (!window.confirm(`Delete payment ${p.receipt}? This can't be undone.`)) return;
    mutate((d) => {
      const invoice = d.invoices.find((i) => i.id === p.invoiceId);
      let invoices = d.invoices;
      if (invoice) {
        const newPaid = Math.max(0, invoice.paid - p.amount);
        invoices = d.invoices.map((i) => i.id === invoice.id ? recalcInvoiceStatus({ ...i, paid: newPaid }) : i);
      }
      return { ...d, invoices, payments: d.payments.filter((x) => x.id !== p.id) };
    });
    toast("Payment deleted");
  };

  const downloadReceipt = (p, invoice, client) => {
    const balance = invoice ? invoice.total - invoice.paid : 0;
    const html = buildReceiptHTML({
      receiptNumber: p.receipt,
      date: p.date,
      client,
      invoiceNumber: invoice?.number,
      amountPaid: p.amount,
      invoiceTotal: invoice?.total || 0,
      paidToDate: invoice?.paid || 0,
      balanceRemaining: balance,
      method: p.note,
      items: invoice?.items,
    });
    downloadDocument(html, `Receipt-${p.receipt}.html`);
    toast("Receipt downloaded — open it and use Print > Save as PDF");
  };

  const downloadInvoice = (inv) => {
    const client = data.clients.find((c) => c.id === inv.clientId);
    const balance = inv.total - inv.paid;
    const html = buildDocHTML({
      docType: "Invoice",
      number: inv.number,
      statusLabel: effectiveInvoiceStatus(inv),
      dateLabel: "Issued",
      dateValue: fmtDate(inv.date),
      secondLabel: inv.dueDate ? "Due" : null,
      secondValue: inv.dueDate ? fmtDate(inv.dueDate) : null,
      client,
      items: inv.items || [],
      notes: inv.notes,
      totals: [
        { label: "Total", value: fmtMoney(inv.total) },
        { label: "Paid", value: fmtMoney(inv.paid) },
        { label: "Balance due", value: fmtMoney(balance), strong: true },
      ],
    });
    downloadDocument(html, `Invoice-${inv.number}.html`);
    toast("Invoice downloaded — open it and use Print > Save as PDF");
  };

  const removeInvoice = (inv) => {
    if (!window.confirm(`Delete invoice ${inv.number}? This can't be undone.`)) return;
    mutate((d) => ({ ...d, invoices: d.invoices.filter((x) => x.id !== inv.id) }));
    toast("Invoice deleted");
    if (viewInvoice?.id === inv.id) setViewInvoice(null);
  };

  const toggleSent = (inv) => {
    mutate((d) => ({ ...d, invoices: d.invoices.map((x) => x.id === inv.id ? { ...x, sent: !x.sent } : x) }));
    toast(inv.sent ? "Marked as not sent" : "Marked as sent");
  };

  const invoiceStats = useMemo(() => {
    const totalInvoiced = data.invoices.reduce((s, i) => s + i.total, 0);
    const outstanding = data.invoices.reduce((s, i) => s + (i.total - i.paid), 0);
    const sent = data.invoices.filter((i) => i.sent).length;
    const notSent = data.invoices.length - sent;
    const overdueInvoices = data.invoices.filter(isInvoiceOverdue);
    const overdueCount = overdueInvoices.length;
    const overdueAmount = overdueInvoices.reduce((s, i) => s + (i.total - i.paid), 0);
    return { totalInvoiced, outstanding, sent, notSent, overdueCount, overdueAmount };
  }, [data.invoices]);

  return (
    <div className="vg-page">
      <PageHeader title="Invoices & Payments" subtitle="Deposits, balances and receipts"
        action={<button className="vg-btn vg-btn--gold" onClick={openNewInvoice}><Plus size={16} />New invoice</button>} />

      <div className="vg-kpi-grid">
        <div className="vg-card vg-kpi">
          <div className="vg-kpi-top">
            <span className="vg-kpi-label">Total invoiced</span>
            <span className="vg-kpi-icon vg-kpi-icon--plain"><Wallet size={16} strokeWidth={1.8} /></span>
          </div>
          <div className="vg-kpi-value">{fmtMoney(invoiceStats.totalInvoiced)}</div>
        </div>
        <div className="vg-card vg-kpi">
          <div className="vg-kpi-top">
            <span className="vg-kpi-label">Outstanding</span>
            <span className="vg-kpi-icon vg-kpi-icon--warn"><PiggyBank size={16} strokeWidth={1.8} /></span>
          </div>
          <div className="vg-kpi-value">{fmtMoney(invoiceStats.outstanding)}</div>
        </div>
        <div className="vg-card vg-kpi">
          <div className="vg-kpi-top">
            <span className="vg-kpi-label">Overdue</span>
            <span className="vg-kpi-icon vg-kpi-icon--danger"><AlertTriangle size={16} strokeWidth={1.8} /></span>
          </div>
          <div className="vg-kpi-value">{fmtMoney(invoiceStats.overdueAmount)}</div>
          {invoiceStats.overdueCount > 0 && <div className="vg-kpi-sub">{invoiceStats.overdueCount} invoice{invoiceStats.overdueCount === 1 ? "" : "s"}</div>}
        </div>
        <div className="vg-card vg-kpi">
          <div className="vg-kpi-top">
            <span className="vg-kpi-label">Sent</span>
            <span className="vg-kpi-icon vg-kpi-icon--gold"><Send size={16} strokeWidth={1.8} /></span>
          </div>
          <div className="vg-kpi-value">{invoiceStats.sent}</div>
        </div>
        <div className="vg-card vg-kpi">
          <div className="vg-kpi-top">
            <span className="vg-kpi-label">Not sent yet</span>
            <span className="vg-kpi-icon vg-kpi-icon--plain"><Clock3 size={16} strokeWidth={1.8} /></span>
          </div>
          <div className="vg-kpi-value">{invoiceStats.notSent}</div>
        </div>
      </div>

      <div className="vg-filter-chips">
        {[["all", "All"], ["paid", "Paid"], ["partial", "Partial"], ["unpaid", "Unpaid"], ["outstanding", "Outstanding"], ["overdue", "Overdue"]].map(([v, label]) => (
          <button key={v} className={`vg-chip ${localFilter === v ? "vg-chip--active" : ""}`} onClick={() => setFilter(v)}>{label}</button>
        ))}
      </div>

      <div className="vg-card vg-card--grow">
        <div className="vg-card-head"><h3>Invoices ({visibleInvoices.length})</h3></div>
        {visibleInvoices.length === 0 ? (
          <EmptyState icon={Wallet} title="No invoices here" body="Generate one for any client, or convert an accepted quotation." actionLabel="New invoice" onAction={openNewInvoice} />
        ) : (
          <div className="vg-table">
            <div className="vg-tr vg-tr--head vg-tr--invoices">
              <div className="vg-td">Number</div>
              <div className="vg-td vg-td--wide">Client</div>
              <div className="vg-td">Total</div>
              <div className="vg-td">Paid</div>
              <div className="vg-td">Balance</div>
              <div className="vg-td">Date</div>
              <div className="vg-td">Status</div>
              <div className="vg-td vg-td--actions" />
            </div>
            {visibleInvoices.map((inv) => {
              const client = data.clients.find((c) => c.id === inv.clientId);
              const balance = inv.total - inv.paid;
              return (
                <div className="vg-tr vg-tr--invoices" key={inv.id}>
                  <div className="vg-td vg-mono">
                    <button className="vg-link" onClick={() => setViewInvoice(inv)}>{inv.number}</button>
                  </div>
                  <div className="vg-td vg-td--wide">{client ? client.name : "—"}</div>
                  <div className="vg-td vg-mono">{fmtMoney(inv.total)}</div>
                  <div className="vg-td vg-mono">{fmtMoney(inv.paid)}</div>
                  <div className="vg-td vg-mono vg-amount">{fmtMoney(balance)}</div>
                  <div className="vg-td">{fmtDate(inv.date)}</div>
                  <div className="vg-td">
                    <StatusPill status={effectiveInvoiceStatus(inv)} />
                    {isInvoiceOverdue(inv) && <div className="vg-cell-sub vg-cell-sub--danger">{daysBetween(inv.dueDate)}d overdue</div>}
                  </div>
                  <div className="vg-td vg-td--actions">
                    <button
                      className={`vg-icon-btn ${inv.sent ? "vg-icon-btn--active" : ""}`}
                      title={inv.sent ? "Sent — click to unmark" : "Mark as sent"}
                      onClick={() => toggleSent(inv)}
                    ><Send size={15} /></button>
                    <button className="vg-icon-btn" title="Download PDF" onClick={() => downloadInvoice(inv)}><Download size={15} /></button>
                    <button className="vg-icon-btn" title="Edit invoice" onClick={() => openEditInvoice(inv)}><Pencil size={15} /></button>
                    <button className="vg-btn vg-btn--sm" disabled={balance <= 0} onClick={() => openPay(inv)}>Record payment</button>
                    <button className="vg-icon-btn vg-icon-btn--danger" title="Delete invoice" onClick={() => removeInvoice(inv)}><Trash2 size={15} /></button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div className="vg-card">
        <div className="vg-card-head"><h3>Payment history</h3></div>
        {data.payments.length === 0 ? (
          <EmptyState icon={Coins} title="No payments recorded" body="Recorded payments will build a running history here." />
        ) : (
          <div className="vg-history">
            {data.payments.map((p) => {
              const client = data.clients.find((c) => c.id === p.clientId);
              const invoice = data.invoices.find((i) => i.id === p.invoiceId);
              return (
                <div className="vg-history-row" key={p.id}>
                  <div>
                    <div className="vg-cell-title vg-mono">{p.receipt} · {client ? client.name : "—"}</div>
                    <div className="vg-cell-sub">{fmtDate(p.date)} · {p.note}</div>
                  </div>
                  <div className="vg-history-row-right">
                    <div className="vg-amount vg-mono">{fmtMoney(p.amount)}</div>
                    <button className="vg-icon-btn" title="Download receipt" onClick={() => downloadReceipt(p, invoice, client)}><Download size={14} /></button>
                    <button className="vg-icon-btn" title="Edit payment" onClick={() => openEditPay(p)}><Pencil size={14} /></button>
                    <button className="vg-icon-btn vg-icon-btn--danger" title="Delete payment" onClick={() => removePayment(p)}><Trash2 size={14} /></button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* ---- generate invoice ---- */}
      <Modal open={newModal} onClose={() => { setNewModal(false); setEditingInvoiceId(null); }} title={editingInvoiceId ? "Edit invoice" : "Generate invoice"} width={620}>
        {form && (
          <div className="vg-form-grid">
            <ClientPicker
              clients={data.clients}
              mode={clientMode}
              onModeChange={setClientMode}
              clientId={form.clientId}
              onClientIdChange={(v) => setForm({ ...form, clientId: v })}
              newClient={newClient}
              onNewClientChange={setNewClient}
            />
            {clientMode === "new" && <p className="vg-form-hint">This client will be added to your CRM automatically when you generate the invoice.</p>}
            <div className="vg-form-row">
              <Field label="Issue date"><input className="vg-input" type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
              <Field label="Due date"><input className="vg-input" type="date" value={form.dueDate} onChange={(e) => setForm({ ...form, dueDate: e.target.value })} /></Field>
            </div>

            <div className="vg-field-label" style={{ marginTop: 4 }}>Line items</div>
            <div className="vg-items">
              <div className="vg-items-head">
                <span>Item</span><span>From package</span><span>Qty</span><span>Price</span><span></span>
              </div>
              {form.items.map((it) => (
                <div className="vg-items-row" key={it.id}>
                  <input className="vg-input" placeholder="Description" value={it.description} onChange={(e) => setItem(it.id, { description: e.target.value })} />
                  <div className="vg-select-wrap">
                    <select className="vg-select" value="" onChange={(e) => pickPackage(it.id, e.target.value)}>
                      <option value="">Select…</option>
                      {data.packages.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                    <ChevronDown size={14} className="vg-select-chevron" />
                  </div>
                  <input className="vg-input vg-input--num" type="number" min={1} value={it.qty} onChange={(e) => setItem(it.id, { qty: e.target.value })} />
                  <input className="vg-input" type="number" placeholder="0" value={it.price} onChange={(e) => setItem(it.id, { price: e.target.value })} />
                  <button className="vg-icon-btn vg-icon-btn--danger" onClick={() => removeItem(it.id)}><Trash2 size={14} /></button>
                </div>
              ))}
            </div>
            <button className="vg-btn vg-btn--ghost vg-btn--sm" style={{ alignSelf: "flex-start" }} onClick={addItem}><Plus size={14} />Add line</button>

            <Field label="Notes (optional)"><input className="vg-input" placeholder="Payment terms, deposit notes…" value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} /></Field>

            <div className="vg-pay-balance">
              <span>Invoice total</span>
              <strong className="vg-mono vg-amount">{fmtMoney(formTotal)}</strong>
            </div>

            <button className="vg-btn vg-btn--gold vg-btn--block" onClick={createInvoice}>{editingInvoiceId ? "Save changes" : "Generate invoice"}</button>
          </div>
        )}
      </Modal>

      {/* ---- view / generated document ---- */}
      <Modal open={!!viewInvoice} onClose={() => setViewInvoice(null)} title="" width={560}>
        {viewInvoice && (() => {
          const client = data.clients.find((c) => c.id === viewInvoice.clientId);
          const balance = viewInvoice.total - viewInvoice.paid;
          return (
            <div className="vg-invoice-doc">
              <div className="vg-invoice-doc-head">
                <div>
                  <div className="vg-brand-name">VG Creative</div>
                  <div className="vg-cell-sub">Nairobi, Kenya</div>
                </div>
                <div className="vg-invoice-doc-meta">
                  <div className="vg-mono">{viewInvoice.number}</div>
                  <StatusPill status={effectiveInvoiceStatus(viewInvoice)} />
                </div>
              </div>
              <div className="vg-invoice-doc-parties">
                <div>
                  <div className="vg-field-label">Billed to</div>
                  <div className="vg-cell-title">{client ? client.name : "—"}</div>
                  <div className="vg-cell-sub">{client?.email}</div>
                </div>
                <div>
                  <div className="vg-field-label">Issued</div>
                  <div className="vg-cell-title">{fmtDate(viewInvoice.date)}</div>
                  {viewInvoice.dueDate && <div className="vg-cell-sub">Due {fmtDate(viewInvoice.dueDate)}</div>}
                </div>
              </div>

              {viewInvoice.items?.length ? (
                <div className="vg-invoice-items">
                  <div className="vg-invoice-items-head">
                    <span>Description</span><span>Qty</span><span>Price</span><span>Amount</span>
                  </div>
                  {viewInvoice.items.map((it) => (
                    <div className="vg-invoice-items-row" key={it.id}>
                      <span>{it.description}</span>
                      <span className="vg-mono">{it.qty}</span>
                      <span className="vg-mono">{fmtMoney(it.price)}</span>
                      <span className="vg-mono">{fmtMoney(it.qty * it.price)}</span>
                    </div>
                  ))}
                </div>
              ) : (
                <p className="vg-cell-sub" style={{ margin: "12px 0" }}>No itemised breakdown for this invoice.</p>
              )}

              {viewInvoice.notes && <p className="vg-cell-sub" style={{ marginTop: 10 }}>{viewInvoice.notes}</p>}

              <div className="vg-invoice-doc-totals">
                <div><span>Total</span><span className="vg-mono">{fmtMoney(viewInvoice.total)}</span></div>
                <div><span>Paid</span><span className="vg-mono">{fmtMoney(viewInvoice.paid)}</span></div>
                <div className="vg-invoice-doc-balance"><span>Balance due</span><span className="vg-mono">{fmtMoney(balance)}</span></div>
              </div>
              <button className="vg-btn vg-btn--gold vg-btn--block" style={{ marginTop: 16 }} onClick={() => downloadInvoice(viewInvoice)}>
                <Download size={15} />Download PDF
              </button>
              <button className="vg-btn vg-btn--ghost vg-btn--block" style={{ marginTop: 8, color: "var(--c-danger)" }} onClick={() => removeInvoice(viewInvoice)}>
                <Trash2 size={15} />Delete invoice
              </button>
            </div>
          );
        })()}
      </Modal>

      <Modal open={!!payModal} onClose={() => setPayModal(null)} title={payModal ? `Record payment — ${payModal.number}` : ""}>
        {payModal && (
          <div className="vg-form-grid">
            <div className="vg-pay-balance">
              <span>Balance due</span>
              <strong className="vg-mono">{fmtMoney(payModal.total - payModal.paid)}</strong>
            </div>
            <Field label="Amount (KES)"><input className="vg-input" type="number" value={payForm.amount} onChange={(e) => setPayForm({ ...payForm, amount: e.target.value })} /></Field>
            <Field label="Date"><input className="vg-input" type="date" value={payForm.date} onChange={(e) => setPayForm({ ...payForm, date: e.target.value })} /></Field>
            <Field label="Note"><input className="vg-input" placeholder="e.g. Deposit, balance…" value={payForm.note} onChange={(e) => setPayForm({ ...payForm, note: e.target.value })} /></Field>
            <button className="vg-btn vg-btn--gold vg-btn--block" onClick={recordPayment}>Record payment</button>
          </div>
        )}
      </Modal>

      <Modal open={!!editPayModal} onClose={() => setEditPayModal(null)} title={editPayModal ? `Edit payment — ${editPayModal.receipt}` : ""}>
        {editPayModal && (
          <div className="vg-form-grid">
            <Field label="Amount (KES)"><input className="vg-input" type="number" value={editPayForm.amount} onChange={(e) => setEditPayForm({ ...editPayForm, amount: e.target.value })} /></Field>
            <Field label="Date"><input className="vg-input" type="date" value={editPayForm.date} onChange={(e) => setEditPayForm({ ...editPayForm, date: e.target.value })} /></Field>
            <Field label="Note"><input className="vg-input" placeholder="e.g. Deposit, balance…" value={editPayForm.note} onChange={(e) => setEditPayForm({ ...editPayForm, note: e.target.value })} /></Field>
            <button className="vg-btn vg-btn--gold vg-btn--block" onClick={saveEditPayment}>Save changes</button>
          </div>
        )}
      </Modal>
    </div>
  );
}

const NAV = [
  { key: "dashboard", label: "Dashboard", icon: Aperture },
  { key: "leads", label: "Leads", icon: Send },
  { key: "clients", label: "Clients (CRM)", icon: Users },
  { key: "packages", label: "Packages", icon: Sparkles },
  { key: "bookings", label: "Bookings", icon: CalendarDays },
  { key: "gear", label: "Gear", icon: Package },
  { key: "equipment", label: "Equipment", icon: Camera },
  { key: "projects", label: "Projects", icon: FolderKanban },
  { key: "expenses", label: "Expenditure", icon: Receipt },
  { key: "quotations", label: "Quotations", icon: FileText },
  { key: "invoices", label: "Invoices & Payments", icon: Wallet },
];

function Shell({ email, onLogout, theme, toggleTheme, data, mutate, toast, onExport, onImport }) {
  const [active, setActive] = useState("dashboard");
  const [pageFilter, setPageFilter] = useState(null);
  const [navOpen, setNavOpen] = useState(false);
  const fileInputRef = useRef(null);

  const goTo = (key) => { setActive(key); setPageFilter(null); setNavOpen(false); };
  const navigate = (page, filter) => { setActive(page); setPageFilter(filter || null); };

  const Page = {
    dashboard: <Dashboard data={data} onNavigate={navigate} />,
    leads: <LeadsPage mutate={mutate} toast={toast} />,
    clients: <ClientsPage data={data} mutate={mutate} toast={toast} />,
    packages: <PackagesPage data={data} mutate={mutate} toast={toast} />,
    bookings: <BookingsPage data={data} mutate={mutate} toast={toast} filter={pageFilter} onFilterChange={setPageFilter} onNavigate={navigate} />,
    gear: <GearPage data={data} mutate={mutate} toast={toast} />,
    equipment: <EquipmentPage data={data} mutate={mutate} toast={toast} />,
    projects: <ProjectsPage data={data} mutate={mutate} toast={toast} filter={pageFilter} onFilterChange={setPageFilter} />,
    expenses: <ExpensesPage data={data} mutate={mutate} toast={toast} />,
    quotations: <QuotationsPage data={data} mutate={mutate} toast={toast} />,
    invoices: <InvoicesPage data={data} mutate={mutate} toast={toast} filter={pageFilter} onFilterChange={setPageFilter} />,
  }[active];

  return (
    <div className="vg-shell">
      <aside className={`vg-sidebar ${navOpen ? "vg-sidebar--open" : ""}`}>
        <div className="vg-brand vg-brand--sidebar">
          <ApertureMark size={26} />
          <div>
            <div className="vg-brand-name">VG Creative</div>
            <div className="vg-brand-sub"></div>
          </div>
        </div>
        <nav className="vg-nav">
          {NAV.map((n) => (
            <button
              key={n.key}
              className={`vg-nav-item ${active === n.key ? "vg-nav-item--active" : ""}`}
              onClick={() => goTo(n.key)}
            >
              <n.icon size={17} strokeWidth={1.8} />
              <span>{n.label}</span>
            </button>
          ))}
        </nav>
        <div className="vg-sidebar-foot">
          <div className="vg-backup-row">
            <button className="vg-icon-btn" title="Download backup (.json)" onClick={onExport}><Download size={15} /></button>
            <button className="vg-icon-btn" title="Restore from backup" onClick={() => fileInputRef.current?.click()}><Upload size={15} /></button>
            <input
              ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }}
              onChange={(e) => { const f = e.target.files?.[0]; if (f) onImport(f); e.target.value = ""; }}
            />
            <button className="vg-icon-btn" onClick={toggleTheme} title="Toggle theme">
              {theme === "dark" ? <Sun size={15} /> : <Moon size={15} />}
            </button>
            <button className="vg-icon-btn" onClick={onLogout} title="Sign out"><LogOut size={15} /></button>
          </div>
          <div className="vg-user-chip">
            <div className="vg-user-avatar">{email.charAt(0).toUpperCase()}</div>
            <span className="vg-mono">{email}</span>
          </div>
        </div>
      </aside>

      <button className="vg-nav-toggle vg-nav-toggle--floating" onClick={() => setNavOpen((v) => !v)}><Menu size={19} /></button>

      <div className="vg-main">
        <main className="vg-content">{Page}</main>
      </div>
    </div>
  );
}

export default function App() {
  const [booted, setBooted] = useState(false);
  const [authed, setAuthed] = useState(false);
  const [email, setEmail] = useState("");
  const [theme, setTheme] = useState("dark");
  const [data, setData] = useState(null);
  const [toasts, setToasts] = useState([]);
  const toastTimer = useRef({});
  // Tracks the last data blob this device itself saved or received, as a
  // JSON string. Lets the realtime listener below tell "a change came in
  // from another device" apart from "Supabase just echoed my own save back
  // to me" — without this, every save would immediately re-trigger itself.
  const lastSyncedRef = useRef(null);

  const toast = useCallback((message) => {
    const id = uid();
    setToasts((t) => [...t, { id, message }]);
    toastTimer.current[id] = setTimeout(() => {
      setToasts((t) => t.filter((x) => x.id !== id));
    }, 2600);
  }, []);

  useEffect(() => {
    (async () => {
      const savedTheme = await loadPersisted("vg_theme_v2", "dark");
      setTheme(savedTheme);
    })();
    // Firebase is the single source of truth for auth state now — this fires
    // once immediately with the current user (or null), then again on every
    // sign-in / sign-out, including across tab refreshes.
    const unsub = onAuthStateChanged(fbAuth, (user) => {
      if (user && isAllowedEmail(user.email)) {
        // Force-refresh the ID token once on sign-in so a just-added
        // "authenticated" role claim (see the one-time Firebase script)
        // is picked up immediately, instead of waiting up to an hour for
        // Firebase's normal token cache to expire.
        user.getIdToken(/* forceRefresh */ true).catch(() => {});
        setAuthed(true); setEmail(user.email || "");
        setBooted(true);
      } else if (user) {
        // A previously-active session whose email is no longer on the
        // allowlist — sign them out rather than letting them in.
        fbSignOut(fbAuth).finally(() => { setAuthed(false); setEmail(""); setBooted(true); });
      } else {
        setAuthed(false); setEmail("");
        setBooted(true);
      }
    });
    return () => unsub();
  }, []);

  // Once we know who's signed in, load their studio's data from Supabase
  // (shared across every device/user with access) instead of localStorage.
  useEffect(() => {
    if (!authed || !email) return;
    (async () => {
      const savedData = await loadStudioData(email);
      const initial = savedData ? migrateLegacyData({ gear: [], expenses: [], equipment: [], hires: [], customCategories: { gear: [], equipment: [], expense: [] }, ...savedData }) : seedData();
      lastSyncedRef.current = stableStringify(initial);
      setData(initial);
    })();
  }, [authed, email]);

  // Live sync: whenever ANY device (including this one, in another tab)
  // saves studio_data, push the fresh copy into state automatically — no
  // manual refresh needed. Requires Realtime enabled for studio_data in
  // the Supabase dashboard (Database > Publications > supabase_realtime).
  useEffect(() => {
    if (!authed || !email) return;
    const unsubscribe = subscribeToStudioData(email, (remoteData) => {
      const json = stableStringify(remoteData);
      if (json === lastSyncedRef.current) return; // our own save echoed back
      lastSyncedRef.current = json;
      setData(migrateLegacyData({ gear: [], expenses: [], equipment: [], hires: [], customCategories: { gear: [], equipment: [], expense: [] }, ...remoteData }));
    });
    return unsubscribe;
  }, [authed, email]);

  useEffect(() => {
    if (!booted || !data || !email) return;
    const json = stableStringify(data);
    if (json === lastSyncedRef.current) return; // came from remote, already in sync
    saveStudioData(email, data).then((ok) => {
      if (ok) lastSyncedRef.current = json;
      else toast("Couldn't save your changes — check your connection and try again.");
    });
  }, [data, booted, email, toast]);
  useEffect(() => { if (booted) savePersisted("vg_theme_v2", theme); }, [theme, booted]);

  const mutate = useCallback((updater) => setData((d) => updater(d)), []);

  const exportData = useCallback(() => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `vg-creatives-backup-${todayISO()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast("Backup downloaded");
  }, [data, toast]);

  const importData = useCallback((file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.clients)) throw new Error("bad shape");
        setData(migrateLegacyData(parsed));
        toast("Backup restored");
      } catch (e) {
        toast("That file doesn't look like a VG Creative backup.");
      }
    };
    reader.readAsText(file);
  }, [toast]);

  // Kept as a no-op passthrough prop name for LoginScreen's onSignIn — actual
  // auth state now comes from the onAuthStateChanged listener above.
  const signIn = () => {};
  const signOut = () => {
    fbSignOut(fbAuth).catch(() => {});
  };
  const toggleTheme = () => setTheme((t) => (t === "dark" ? "light" : "dark"));

  if (!booted || (authed && !data)) {
    return (
      <div className="vg-root" data-theme={theme}>
        <style>{CSS}</style>
        <div className="vg-boot">
          <ApertureMark size={40} spin />
        </div>
      </div>
    );
  }

  return (
    <div className="vg-root" data-theme={theme}>
      <style>{CSS}</style>
      {!authed ? (
        <LoginScreen onSignIn={signIn} />
      ) : (
        <Shell email={email} onLogout={signOut} theme={theme} toggleTheme={toggleTheme} data={data} mutate={mutate} toast={toast} onExport={exportData} onImport={importData} />
      )}
      <Toast toasts={toasts} />
    </div>
  );
}
