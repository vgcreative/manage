const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtMoney = (n) => `Ksh ${Math.round(Number(n) || 0).toLocaleString("en-KE")}`;
const fmtDate = (iso) => {
  if (!iso) return "—";
  const d = new Date(iso + (iso.length === 10 ? "T00:00:00" : ""));
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
};
const monthLabel = (iso) => {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-US", { month: "short" });
};
const daysBetween = (iso) => {
  if (!iso) return 0;
  const then = new Date(iso + "T00:00:00");
  const now = new Date(todayISO() + "T00:00:00");
  return Math.round((now - then) / 86400000);
};

/* Booking date-range helpers. Bookings now span a start→end date instead of
   a single date — these stay backward compatible with any older booking
   record that only has a plain `date` field. */
function fmtBookingDates(b) {
  const start = b.startDate || b.date;
  const end = b.endDate || b.date || start;
  if (!start) return "—";
  if (!end || end === start) return fmtDate(start);
  return `${fmtDate(start)} → ${fmtDate(end)}`;
}
function bookingDateList(b) {
  const start = b.startDate || b.date;
  const end = b.endDate || b.date || start;
  if (!start) return [];
  const cur = new Date(start + "T00:00:00");
  const last = new Date((end || start) + "T00:00:00");
  if (isNaN(cur) || isNaN(last) || last < cur) return [start];
  const out = [];
  let guard = 0;
  while (cur <= last && guard < 400) {
    out.push(cur.toISOString().slice(0, 10));
    cur.setDate(cur.getDate() + 1);
    guard++;
  }
  return out;
}

/* An invoice is overdue once its due date has passed and it still has a
   balance outstanding — paid/cancelled invoices are never overdue. */
const isInvoiceOverdue = (inv) =>
  !!inv.dueDate && inv.dueDate < todayISO() && (inv.status === "unpaid" || inv.status === "partial");
const effectiveInvoiceStatus = (inv) => (isInvoiceOverdue(inv) ? "overdue" : inv.status);

/* A quotation expires once its "valid until" date passes while it's still
   sitting as a draft — once accepted or invoiced it's no longer just an
   open offer, so it stops being eligible to "expire". */
const isQuoteExpired = (q) =>
  !!q.validUntil && q.validUntil < todayISO() && q.status === "draft";
const effectiveQuoteStatus = (q) => (isQuoteExpired(q) ? "expired" : q.status);

/* Every generated invoice gets a matching project, dated to the day the
   invoice was raised, so production tracking always has a home. */
const makeProjectFromInvoice = ({ client, title, shootDate, invoiceId, bookingId, quotationId }) => ({
  id: uid(),
  title: title || (client ? `${client.name} — shoot` : "Untitled project"),
  clientId: client ? client.id : "",
  status: "planning",
  shootDate: shootDate || todayISO(),
  deliveryDate: shootDate || todayISO(),
  invoiceId, bookingId, quotationId,
});

/* Nudges the project tied to an invoice forward along its stages as the
   client pays: half paid means the shoot itself is done and it's now in
   post-production ("shooting" stage, 50%), fully paid marks the whole
   project complete. Never moves a project backwards — editing an earlier
   payment down, or deleting one, won't un-complete or un-shoot a project. */
const PROJECT_STATUS_ORDER = ["planning", "shooting", "editing", "completed"];

const paymentMilestoneStatus = (paidPct) => {
  if (paidPct >= 1) return "completed";
  if (paidPct >= 0.5) return "shooting";
  return null;
};

const syncProjectWithPayment = (projects, invoiceId, paidPct) => {
  const target = paymentMilestoneStatus(paidPct);
  if (!target) return projects;
  const targetIdx = PROJECT_STATUS_ORDER.indexOf(target);
  return projects.map((p) => {
    if (p.invoiceId !== invoiceId) return p;
    const currentIdx = PROJECT_STATUS_ORDER.indexOf(p.status);
    return targetIdx > currentIdx ? { ...p, status: target } : p;
  });
};

/* Gear double-booking: for each active (non-cancelled) booking date, tally
   how many bookings need each gear item that day and compare against how
   many of that item the studio actually owns. Bookings that span a range
   of dates count against every day in that range. */
function computeGearConflicts(bookings, gear) {
  const byDateGear = {};
  bookings.forEach((b) => {
    if (b.status === "cancelled" || !Array.isArray(b.gearIds) || b.gearIds.length === 0) return;
    bookingDateList(b).forEach((date) => {
      b.gearIds.forEach((gearId) => {
        const key = `${date}__${gearId}`;
        if (!byDateGear[key]) byDateGear[key] = { date, gearId, bookings: [] };
        if (!byDateGear[key].bookings.some((bb) => bb.id === b.id)) byDateGear[key].bookings.push(b);
      });
    });
  });
  const conflicts = [];
  Object.values(byDateGear).forEach((entry) => {
    const item = gear.find((g) => g.id === entry.gearId);
    if (!item) return;
    const owned = Number(item.qtyOwned) || 1;
    if (entry.bookings.length > owned) {
      conflicts.push({ date: entry.date, gear: item, owned, needed: entry.bookings.length, bookings: entry.bookings });
    }
  });
  return conflicts.sort((a, b) => a.date.localeCompare(b.date));
}

/* Downscale + re-encode a photo before it goes into state/localStorage.
   Equipment photos come straight off a phone camera (often several MB
   each); four of those as raw base64 can blow past localStorage's quota
   and silently fail to save (see savePersisted below), and heavy images
   are also what makes the photo viewer feel choppy. Capping the longest
   side and re-encoding as JPEG keeps things fast and small while still
   looking sharp at the sizes this app ever displays them. */
const MAX_PHOTO_DIMENSION = 1400;
const PHOTO_JPEG_QUALITY = 0.82;
function readAndCompressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error || new Error("Could not read file"));
    reader.onload = () => {
      const img = new window.Image();
      img.onerror = () => resolve(reader.result); // fall back to the original if it won't decode
      img.onload = () => {
        const scale = Math.min(1, MAX_PHOTO_DIMENSION / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        try {
          resolve(canvas.toDataURL("image/jpeg", PHOTO_JPEG_QUALITY));
        } catch (e) {
          resolve(reader.result); // e.g. tainted canvas — fall back to the original
        }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function downloadDocument(html, filename) {
  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* Backward-compat migration for data saved before the Services→Packages
   rename and before bookings moved from a single date to a date range.
   Runs on every load (fresh boot, remote sync, or a restored backup) so
   older saved data keeps working without a manual fix-up. */
function migrateLegacyData(d) {
  const packages = (d.packages && d.packages.length) ? d.packages : (d.services || []);
  const bookings = (d.bookings || []).map((b) => ({
    ...b,
    packageId: b.packageId || b.serviceId || "",
    startDate: b.startDate || b.date || todayISO(),
    endDate: b.endDate || b.date || b.startDate || todayISO(),
  }));
  return { ...d, packages, bookings };
}

/* ------------------------------- storage ---------------------------------
   Real persistence in localStorage, so the studio's data survives reloads
   and closing the tab (the original window.storage API only exists inside
   Claude's artifact runtime, not in a plain browser). --------------------- */
async function loadPersisted(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw != null) return JSON.parse(raw);
  } catch (e) { /* not found yet, or storage unavailable */ }
  return fallback;
}
async function savePersisted(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { console.error("storage save failed", e); return false; }
}

/* ---------------------- Supabase-backed studio data -----------------------
   Replaces localStorage for the actual business data (clients, projects,
   quotations, invoices, expenses, equipment, hires) so it's shared across
   devices/users instead of stuck in one browser. Keyed by the signed-in
   Firebase user's email. Theme preference stays in localStorage — it's a
   per-device UI setting, not something that needs to sync. --------------- */
async function loadStudioData(email) {
  try {
    const { data: row, error } = await supabase
      .from("studio_data")
      .select("data")
      .eq("owner_email", email)
      .maybeSingle();
    if (error) throw error;
    return row ? row.data : null;
  } catch (e) {
    console.error("Supabase load failed", e);
    return null;
  }
}
/* Compares two data blobs for equality regardless of object-key order.
   Needed because Postgres/JSONB doesn't preserve the key order we saved
   with, so a plain JSON.stringify() comparison would see every echo of
   our own save as "different" and re-trigger a save loop (the item
   flashing/reappearing bug). Sorting keys before stringifying makes the
   comparison order-independent. */
function stableStringify(value) {
  if (value === null || typeof value !== "object") return JSON.stringify(value);
  if (Array.isArray(value)) return `[${value.map(stableStringify).join(",")}]`;
  const keys = Object.keys(value).sort();
  return `{${keys.map((k) => JSON.stringify(k) + ":" + stableStringify(value[k])).join(",")}}`;
}

async function saveStudioData(email, value) {
  try {
    const { error } = await supabase
      .from("studio_data")
      .upsert(
        { owner_email: email, data: value, updated_at: new Date().toISOString() },
        { onConflict: "owner_email" }
      );
    if (error) throw error;
    return true;
  } catch (e) {
    console.error("Supabase save failed", e);
    return false;
  }
}

/* Live sync: subscribes to Postgres changes on this user's studio_data row
   (Realtime must be turned on for that table in the Supabase dashboard —
   Database > Publications > supabase_realtime). Whenever ANY device saves,
   every other open session gets pushed the fresh row and updates itself,
   no manual refresh needed. onRemoteChange receives the new `data` blob. */
function subscribeToStudioData(email, onRemoteChange) {
  const channel = supabase
    .channel(`studio_data_${email}`)
    .on(
      "postgres_changes",
      { event: "*", schema: "public", table: "studio_data", filter: `owner_email=eq.${email}` },
      (payload) => {
        const row = payload.new;
        if (row && row.data) onRemoteChange(row.data);
      }
    )
    .subscribe();
  return () => { supabase.removeChannel(channel); };
}

/* Category dropdown used for gear, equipment and expense categories.
   Replaces the old fixed "Other" option: instead, picking "+ Add new
   category" reveals a small inline input so the person can type their
   own category, which is then saved to data.customCategories and shows
   up in the dropdown (and in filters/breakdowns) everywhere else on the
   site from then on. Custom categories can also be removed again via
   "Manage categories" — built-in categories can't be deleted. */
function CategorySelect({ value, builtIn, custom, onChange, onAddCategory, onDeleteCategory }) {
  const [adding, setAdding] = useState(false);
  const [managing, setManaging] = useState(false);
  const [draft, setDraft] = useState("");
  const customList = custom || [];
  const options = useMemo(() => {
    const list = [...builtIn, ...customList];
    // Keep an existing-but-unlisted value selectable (e.g. legacy "Other" data).
    if (value && !list.includes(value)) list.unshift(value);
    return list;
  }, [builtIn, customList, value]);

  const handleChange = (v) => {
    if (v === "__add_new__") {
      setDraft("");
      setAdding(true);
      setManaging(false);
      return;
    }
    if (v === "__manage__") {
      setManaging(true);
      setAdding(false);
      return;
    }
    onChange(v);
  };

  const confirmAdd = () => {
    const name = draft.trim();
    if (!name) { setAdding(false); return; }
    onAddCategory(name);
    onChange(name);
    setAdding(false);
  };

  const deleteCategory = (name) => {
    if (!window.confirm(`Delete the "${name}" category? Items already using it will keep the label — it just won't be offered as a choice anymore.`)) return;
    onDeleteCategory(name);
  };

  return (
    <div className="vg-category-select">
      <div className="vg-select-wrap">
        <select className="vg-select" value={value} onChange={(e) => handleChange(e.target.value)}>
          {options.map((o) => (
            <option key={o} value={o}>{o}</option>
          ))}
          <option value="__add_new__">+ Add new category…</option>
          {customList.length > 0 && <option value="__manage__">Manage categories…</option>}
        </select>
        <ChevronDown size={15} className="vg-select-chevron" />
      </div>
      {adding && (
        <div className="vg-category-add-row">
          <input
            className="vg-input" autoFocus placeholder="New category name"
            value={draft} onChange={(e) => setDraft(e.target.value)}
            onKeyDown={(e) => {
              if (e.key === "Enter") { e.preventDefault(); confirmAdd(); }
              if (e.key === "Escape") setAdding(false);
            }}
          />
          <button type="button" className="vg-btn vg-btn--sm vg-btn--gold" onClick={confirmAdd}>Add</button>
          <button type="button" className="vg-icon-btn" onClick={() => setAdding(false)} aria-label="Cancel"><X size={14} /></button>
        </div>
      )}
      {managing && (
        <div className="vg-category-manage">
          {customList.length === 0 ? (
            <div className="vg-cell-sub">No custom categories yet.</div>
          ) : (
            customList.map((c) => (
              <div className="vg-category-manage-row" key={c}>
                <span>{c}</span>
                <button type="button" className="vg-icon-btn vg-icon-btn--danger" title={`Delete ${c}`} onClick={() => deleteCategory(c)}><Trash2 size={13} /></button>
              </div>
            ))
          )}
          <button type="button" className="vg-btn vg-btn--sm" onClick={() => setManaging(false)} style={{ alignSelf: "flex-start" }}>Done</button>
        </div>
      )}
    </div>
  );
}

/* Appends a new custom category (deduped, ignoring case) to the given
   bucket ("gear" | "equipment" | "expense") in customCategories. */
function addCustomCategory(mutate, bucket, name) {
  mutate((d) => {
    const existing = (d.customCategories && d.customCategories[bucket]) || [];
    if (existing.some((c) => c.toLowerCase() === name.toLowerCase())) return d;
    return {
      ...d,
      customCategories: { ...(d.customCategories || {}), [bucket]: [...existing, name] },
    };
  });
}

/* Removes a custom category from the given bucket. Items that already used
   it keep the stored string as-is (see CategorySelect's fallback logic) —
   this only stops it being offered as a choice going forward. */
function removeCustomCategory(mutate, bucket, name) {
  mutate((d) => {
    const existing = (d.customCategories && d.customCategories[bucket]) || [];
    return {
      ...d,
      customCategories: { ...(d.customCategories || {}), [bucket]: existing.filter((c) => c !== name) },
    };
  });
}

function Dashboard({ data, onNavigate }) {
  const { clients, bookings, projects, invoices, payments, quotations, expenses, gear, hires } = data;
  const go = (page, filter) => onNavigate && onNavigate(page, filter);

  const [trendModalOpen, setTrendModalOpen] = useState(false);
  const [trendYear, setTrendYear] = useState(() => new Date().getFullYear());
  const [monthDetail, setMonthDetail] = useState(null); // { year, month } — month is 0-indexed

  /* Equipment hire invoices are split out and kept out of every other
     dashboard figure — revenue collected, outstanding, overdue, net profit,
     the revenue trend and the expenditure donut all reflect bookings/
     projects/other services only. Equipment's own collected/outstanding
     numbers live solely in the dedicated Equipment profit card below. */
  const equipmentInvoices = useMemo(() => invoices.filter((i) => !!i.hireId), [invoices]);
  const equipmentInvoiceIds = useMemo(() => new Set(equipmentInvoices.map((i) => i.id)), [equipmentInvoices]);
  const otherInvoices = useMemo(() => invoices.filter((i) => !i.hireId), [invoices]);
  const otherPayments = useMemo(() => payments.filter((p) => !equipmentInvoiceIds.has(p.invoiceId)), [payments, equipmentInvoiceIds]);

  const equipmentProfit = useMemo(() => equipmentInvoices.reduce((s, i) => s + Number(i.paid || 0), 0), [equipmentInvoices]);
  const equipmentOutstanding = useMemo(() => equipmentInvoices.reduce((s, i) => s + (Number(i.total || 0) - Number(i.paid || 0)), 0), [equipmentInvoices]);

  // Revenue collected — pulled straight from payments recorded against paid
  // invoices, so this figure (and everything derived from it below) always
  // traces back to actual money received, not just invoiced amounts.
  const revenueCollected = useMemo(() => otherInvoices.reduce((s, i) => s + Number(i.paid || 0), 0), [otherInvoices]);
  const outstanding = useMemo(() => otherInvoices.reduce((s, i) => s + (Number(i.total || 0) - Number(i.paid || 0)), 0), [otherInvoices]);
  const totalCosts = useMemo(() => (expenses || []).reduce((s, e) => s + Number(e.amount || 0), 0), [expenses]);
  const netProfit = revenueCollected - totalCosts;
  const activeProjects = useMemo(() => projects.filter((p) => p.status !== "completed").length, [projects]);
  const upcomingShoots = useMemo(() => {
    const now = new Date(new Date().toDateString());
    return bookings.filter((b) => b.status !== "cancelled" && new Date((b.endDate || b.date || b.startDate) + "T00:00:00") >= now).length;
  }, [bookings]);

  const overdueInvoices = useMemo(() => otherInvoices.filter(isInvoiceOverdue), [otherInvoices]);
  const expiredQuotes = useMemo(() => (quotations || []).filter(isQuoteExpired), [quotations]);
  const gearConflicts = useMemo(() => computeGearConflicts(bookings, gear || []), [bookings, gear]);
  const hasAlerts = overdueInvoices.length > 0 || expiredQuotes.length > 0 || gearConflicts.length > 0;

  // Mini chart on the dashboard card — full current year, Jan through Dec,
  // built from the same revenue-collected payments as the KPI above.
  const currentYear = new Date().getFullYear();
  const trend = useMemo(() => {
    const totals = Array(12).fill(0);
    otherPayments.forEach((p) => {
      if (!p.date) return;
      const d = new Date(p.date + "T00:00:00");
      if (d.getFullYear() !== currentYear) return;
      totals[d.getMonth()] += Number(p.amount || 0);
    });
    return totals.map((value, m) => ({ month: new Date(currentYear, m, 1).toLocaleDateString("en-US", { month: "short" }), value }));
  }, [otherPayments, currentYear]);

  // Full year-by-year breakdown for the "View year" drill-down — revenue
  // collected, expenditure logged and the resulting profit, per month.
  const yearOverview = useMemo(() => {
    return Array.from({ length: 12 }, (_, m) => {
      const prefix = `${trendYear}-${String(m + 1).padStart(2, "0")}`;
      const revenue = otherPayments.filter((p) => p.date && p.date.startsWith(prefix)).reduce((s, p) => s + Number(p.amount || 0), 0);
      const expenditure = (expenses || []).filter((e) => e.date && e.date.startsWith(prefix)).reduce((s, e) => s + Number(e.amount || 0), 0);
      return { month: m, label: new Date(trendYear, m, 1).toLocaleDateString("en-US", { month: "long" }), revenue, expenditure, profit: revenue - expenditure };
    });
  }, [trendYear, otherPayments, expenses]);

  // Transaction-level breakdown for whichever month is drilled into —
  // who paid what, and where the money went.
  const monthTransactions = useMemo(() => {
    if (!monthDetail) return null;
    const prefix = `${monthDetail.year}-${String(monthDetail.month + 1).padStart(2, "0")}`;
    const monthPayments = otherPayments
      .filter((p) => p.date && p.date.startsWith(prefix))
      .map((p) => {
        const invoice = data.invoices.find((i) => i.id === p.invoiceId);
        const client = data.clients.find((c) => c.id === p.clientId);
        return { ...p, invoiceNumber: invoice?.number, clientName: client ? client.name : "—" };
      })
      .sort((a, b) => (a.date < b.date ? 1 : -1));
    const monthExpenses = (expenses || [])
      .filter((e) => e.date && e.date.startsWith(prefix))
      .map((e) => {
        const project = data.projects.find((p) => p.id === e.projectId);
        return { ...e, projectTitle: project?.title };
      })
      .sort((a, b) => (a.date < b.date ? 1 : -1));
    return { monthPayments, monthExpenses };
  }, [monthDetail, otherPayments, expenses, data.invoices, data.clients, data.projects]);

  // Expenditure by category — same rounded donut style the dashboard used
  // for invoice status, now showing where money actually went, in a
  // distinct warm palette so it never reads as revenue.
  const EXPENSE_DONUT_COLORS = ["#c1554a", "#d9793f", "#b8894a", "#a5573f", "#8a6c53", "#b23b58"];
  const expenditureByCategory = useMemo(() => {
    const map = {};
    (expenses || []).forEach((e) => { map[e.category] = (map[e.category] || 0) + Number(e.amount || 0); });
    return Object.entries(map)
      .map(([name, value], i) => ({ name, value, color: EXPENSE_DONUT_COLORS[i % EXPENSE_DONUT_COLORS.length] }))
      .filter((d) => d.value > 0)
      .sort((a, b) => b.value - a.value);
  }, [expenses]);

  const kpis = [
    { label: "Revenue collected", value: fmtMoney(revenueCollected), icon: Coins, tone: "gold", page: "invoices", filter: "paid", pageLabel: "Invoices" },
    { label: "Net profit", value: fmtMoney(netProfit), icon: PiggyBank, tone: netProfit >= 0 ? "gold" : "danger", page: "expenses", pageLabel: "Expenditure" },
    { label: "Total costs", value: fmtMoney(totalCosts), icon: Receipt, tone: "warn", page: "expenses", pageLabel: "Expenditure" },
    { label: "Outstanding", value: fmtMoney(outstanding), icon: PiggyBank, tone: "warn", page: "invoices", filter: "outstanding", pageLabel: "Invoices" },
    { label: "Overdue", value: fmtMoney(overdueInvoices.reduce((s, i) => s + (i.total - i.paid), 0)), icon: AlertTriangle, tone: overdueInvoices.length ? "danger" : "plain", page: "invoices", filter: "overdue", pageLabel: "Invoices" },
    { label: "Active projects", value: activeProjects, icon: FolderKanban, tone: "plain", page: "projects", filter: "active", pageLabel: "Projects" },
    { label: "Upcoming shoots", value: upcomingShoots, icon: CalendarDays, tone: "plain", page: "bookings", filter: "upcoming", pageLabel: "Bookings" },
  ];

  return (
    <div className="vg-page">
      <PageHeader title="Creative  Dashboard" subtitle="Live view of revenue, bookings and delivery" />

      {hasAlerts && (
        <div className="vg-alert-banner">
          <AlertTriangle size={16} />
          <div>
            <strong>Needs attention</strong>
            <div className="vg-alert-banner-body">
              {overdueInvoices.length > 0 && (
                <button type="button" className="vg-alert-link" onClick={() => go("invoices", "overdue")}>
                  {overdueInvoices.length} invoice{overdueInvoices.length === 1 ? "" : "s"} overdue — {fmtMoney(overdueInvoices.reduce((s, i) => s + (i.total - i.paid), 0))} outstanding
                </button>
              )}
              {expiredQuotes.length > 0 && (
                <button type="button" className="vg-alert-link" onClick={() => go("quotations")}>
                  {expiredQuotes.length} quotation{expiredQuotes.length === 1 ? "" : "s"} expired without a decision
                </button>
              )}
              {gearConflicts.length > 0 && (
                <button type="button" className="vg-alert-link" onClick={() => go("bookings")}>
                  {gearConflicts.length} gear double-booking{gearConflicts.length === 1 ? "" : "s"} on upcoming shoot dates
                </button>
              )}
            </div>
          </div>
        </div>
      )}

      <div className="vg-kpi-grid">
        {kpis.map((k, i) => (
          <button
            type="button"
            className="vg-card vg-kpi vg-kpi--clickable"
            key={k.label}
            style={{ animationDelay: `${i * 60}ms` }}
            onClick={() => go(k.page, k.filter)}
            title={`View in ${k.pageLabel}`}
          >
            <div className="vg-kpi-top">
              <span className="vg-kpi-label">{k.label}</span>
              <span className={`vg-kpi-icon vg-kpi-icon--${k.tone}`}><k.icon size={16} strokeWidth={1.8} /></span>
            </div>
            <div className="vg-kpi-value">{k.value}</div>
            <div className="vg-kpi-link"><ArrowUpRight size={13} /><span>View detail</span></div>
          </button>
        ))}
      </div>

      {/* Equipment profit — a standalone card, separate from the KPI grid
          above on purpose, so it never reads as part of Net profit. */}
      <button type="button" className="vg-card vg-equip-profit-card" onClick={() => go("equipment")} title="View in Equipment">
        <div className="vg-equip-profit-head">
          <span className="vg-kpi-icon vg-kpi-icon--gold"><Camera size={16} strokeWidth={1.8} /></span>
          <div>
            <div className="vg-equip-profit-label">Equipment profit</div>
            <div className="vg-equip-profit-sub">From equipment hires only — kept separate from Net profit and expenses above</div>
          </div>
        </div>
        <div className="vg-equip-profit-figures">
          <div>
            <span className="vg-cell-sub">Collected</span>
            <div className="vg-kpi-value">{fmtMoney(equipmentProfit)}</div>
          </div>
          <div>
            <span className="vg-cell-sub">Outstanding</span>
            <div className="vg-kpi-value vg-kpi-value--sub">{fmtMoney(equipmentOutstanding)}</div>
          </div>
        </div>
      </button>

      <div className="vg-dash-grid">
        <div className="vg-card vg-chart-card">
          <div className="vg-card-head vg-card-head--split">
            <div>
              <h3>Revenue trend</h3>
              <p>Revenue collected per month · {currentYear}</p>
            </div>
            <button type="button" className="vg-btn vg-btn--sm" onClick={() => setTrendModalOpen(true)}>View full year</button>
          </div>
          <div className="vg-chart-wrap vg-chart-wrap--clickable" onClick={() => setTrendModalOpen(true)} title="Click to see every month, with profit and expenditure">
            <ResponsiveContainer width="100%" height={260}>
              <AreaChart data={trend} margin={{ top: 10, right: 12, left: -12, bottom: 0 }}>
                <defs>
                  <linearGradient id="vgGold" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="var(--c-gold)" stopOpacity={0.45} />
                    <stop offset="100%" stopColor="var(--c-gold)" stopOpacity={0} />
                  </linearGradient>
                </defs>
                <CartesianGrid stroke="var(--c-grid)" strokeDasharray="3 5" vertical={false} />
                <XAxis dataKey="month" stroke="var(--c-muted)" fontSize={12} fontFamily="Inter" tickLine={false} axisLine={false} />
                <YAxis stroke="var(--c-muted)" fontSize={12} fontFamily="Inter" tickLine={false} axisLine={false}
                  tickFormatter={(v) => v === 0 ? "0" : `${Math.round(v / 1000)}k`} width={38} />
                <Tooltip content={<ChartTooltip />} />
                <Area type="monotone" dataKey="value" stroke="var(--c-gold)" strokeWidth={2.25} fill="url(#vgGold)" />
              </AreaChart>
            </ResponsiveContainer>
          </div>
        </div>

        <div className="vg-card vg-donut-card">
          <div className="vg-card-head"><div><h3>Expenditure by category</h3><p>Where costs went</p></div></div>
          {expenditureByCategory.length === 0 ? (
            <div className="vg-empty vg-empty--tight">
              <p>No expenditure logged yet.</p>
            </div>
          ) : (
            <>
              <div className="vg-donut-wrap">
                <ResponsiveContainer width="100%" height={200}>
                  <PieChart>
                    <Pie data={expenditureByCategory} dataKey="value" nameKey="name" innerRadius={58} outerRadius={82} paddingAngle={3} strokeWidth={0}>
                      {expenditureByCategory.map((d, i) => <Cell key={i} fill={d.color} />)}
                    </Pie>
                    <Tooltip content={<DonutTooltip />} />
                  </PieChart>
                </ResponsiveContainer>
              </div>
              <div className="vg-legend">
                {expenditureByCategory.map((d) => (
                  <button type="button" className="vg-legend-row vg-legend-row--clickable" key={d.name} onClick={() => go("expenses")}>
                    <span className="vg-legend-dot" style={{ background: d.color }} />
                    <span className="vg-legend-name">{d.name}</span>
                    <span className="vg-legend-val">{fmtMoney(d.value)}</span>
                  </button>
                ))}
              </div>
            </>
          )}
        </div>
      </div>

      <div className="vg-dash-grid vg-dash-grid--cal">
        <BookingCalendar bookings={bookings} onNavigate={onNavigate} />

        <div className="vg-card">
          <div className="vg-card-head"><div><h3>Upcoming</h3><p>Next confirmed shoots</p></div></div>
          {bookings.filter(b => b.status === "reserved" || b.status === "confirmed").length === 0 ? (
            <EmptyState icon={CalendarDays} title="Nothing on the books" body="Reserved shoots will appear here as soon as a booking is confirmed." />
          ) : (
            <div className="vg-mini-list">
              {bookings.filter(b => b.status === "reserved" || b.status === "confirmed").map((b) => {
                const c = clients.find((c) => c.id === b.clientId);
                return (
                  <button type="button" className="vg-mini-row vg-mini-row--clickable" key={b.id} onClick={() => go("bookings", "upcoming")}>
                    <div className="vg-mini-row-icon"><Clock3 size={15} /></div>
                    <div className="vg-mini-row-main">
                      <strong>{b.event}</strong>
                      <span>{c ? c.name : "—"} · {b.location}</span>
                    </div>
                    <div className="vg-mini-row-date">{fmtBookingDates(b)}</div>
                  </button>
                );
              })}
            </div>
          )}
        </div>
      </div>

      <Modal open={trendModalOpen} onClose={() => setTrendModalOpen(false)} title="Revenue & expenditure by month" width={640}>
        <div className="vg-calendar-nav" style={{ justifyContent: "center", marginBottom: 12 }}>
          <button type="button" className="vg-icon-btn" onClick={() => setTrendYear((y) => y - 1)} aria-label="Previous year"><ChevronLeft size={16} /></button>
          <span className="vg-calendar-month">{trendYear}</span>
          <button type="button" className="vg-icon-btn" onClick={() => setTrendYear((y) => y + 1)} aria-label="Next year"><ChevronRight size={16} /></button>
        </div>
        <p className="vg-form-hint" style={{ marginBottom: 10 }}>Click any month to see who paid and where the money went.</p>
        <div className="vg-table">
          <div className="vg-tr vg-tr--head vg-tr--yearmonths">
            <div className="vg-td">Month</div>
            <div className="vg-td">Revenue</div>
            <div className="vg-td">Expenditure</div>
            <div className="vg-td">Profit</div>
          </div>
          {yearOverview.map((m) => (
            <button
              type="button"
              className="vg-tr vg-tr--yearmonths vg-tr--clickable"
              key={m.month}
              onClick={() => setMonthDetail({ year: trendYear, month: m.month })}
            >
              <div className="vg-td">{m.label}</div>
              <div className="vg-td vg-mono">{fmtMoney(m.revenue)}</div>
              <div className="vg-td vg-mono">{fmtMoney(m.expenditure)}</div>
              <div className={`vg-td vg-mono ${m.profit < 0 ? "vg-cell-sub--danger" : ""}`}>{fmtMoney(m.profit)}</div>
            </button>
          ))}
        </div>
      </Modal>

      <Modal
        open={!!monthDetail}
        onClose={() => setMonthDetail(null)}
        title={monthDetail ? new Date(monthDetail.year, monthDetail.month, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" }) : ""}
        width={640}
      >
        {monthDetail && monthTransactions && (
          <>
            <div className="vg-project-dates" style={{ marginBottom: 14, gap: 14 }}>
              <span>Revenue {fmtMoney(monthTransactions.monthPayments.reduce((s, p) => s + Number(p.amount || 0), 0))}</span>
              <span className="vg-dot-sep">·</span>
              <span>Expenditure {fmtMoney(monthTransactions.monthExpenses.reduce((s, e) => s + Number(e.amount || 0), 0))}</span>
            </div>

            <div className="vg-card-head"><h3>Revenue — who paid</h3></div>
            {monthTransactions.monthPayments.length === 0 ? (
              <p className="vg-form-hint">No payments recorded this month.</p>
            ) : (
              <div className="vg-mini-list" style={{ marginBottom: 18 }}>
                {monthTransactions.monthPayments.map((p) => (
                  <div className="vg-mini-row" key={p.id}>
                    <div className="vg-mini-row-icon"><Coins size={15} /></div>
                    <div className="vg-mini-row-main">
                      <strong>{p.clientName}</strong>
                      <span>{p.invoiceNumber || "—"} · {p.note || "Payment"}</span>
                    </div>
                    <div className="vg-mini-row-date">{fmtMoney(p.amount)}</div>
                  </div>
                ))}
              </div>
            )}

            <div className="vg-card-head"><h3>Expenditure — where it went</h3></div>
            {monthTransactions.monthExpenses.length === 0 ? (
              <p className="vg-form-hint">No expenditure logged this month.</p>
            ) : (
              <div className="vg-mini-list">
                {monthTransactions.monthExpenses.map((e) => (
                  <div className="vg-mini-row" key={e.id}>
                    <div className="vg-mini-row-icon"><Receipt size={15} /></div>
                    <div className="vg-mini-row-main">
                      <strong>{e.category}</strong>
                      <span>{e.description}{e.projectTitle ? ` · ${e.projectTitle}` : ""}</span>
                    </div>
                    <div className="vg-mini-row-date">{fmtMoney(e.amount)}</div>
                  </div>
                ))}
              </div>
            )}
          </>
        )}
      </Modal>
    </div>
  );
}

const DOW_LABELS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

function BookingCalendar({ bookings, onNavigate }) {
  const now = new Date();
  const [viewYear, setViewYear] = useState(now.getFullYear());
  const [viewMonth, setViewMonth] = useState(now.getMonth()); // 0-indexed

  const go = () => onNavigate && onNavigate("bookings");

  const monthLabel = useMemo(
    () => new Date(viewYear, viewMonth, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" }),
    [viewYear, viewMonth]
  );

  const bookedByDate = useMemo(() => {
    const map = {};
    bookings.filter((b) => b.status !== "cancelled").forEach((b) => {
      bookingDateList(b).forEach((date) => {
        (map[date] = map[date] || []).push(b);
      });
    });
    return map;
  }, [bookings]);

  const weeks = useMemo(() => {
    const firstWeekday = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const cells = Array(firstWeekday).fill(null).concat(Array.from({ length: daysInMonth }, (_, i) => i + 1));
    while (cells.length % 7 !== 0) cells.push(null);
    const rows = [];
    for (let i = 0; i < cells.length; i += 7) rows.push(cells.slice(i, i + 7));
    return rows;
  }, [viewYear, viewMonth]);

  const prevMonth = () => { if (viewMonth === 0) { setViewMonth(11); setViewYear((y) => y - 1); } else setViewMonth((m) => m - 1); };
  const nextMonth = () => { if (viewMonth === 11) { setViewMonth(0); setViewYear((y) => y + 1); } else setViewMonth((m) => m + 1); };
  const goToday = () => { setViewYear(now.getFullYear()); setViewMonth(now.getMonth()); };

  const dateKey = (day) => `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
  const todayKey = todayISO();

  return (
    <div className="vg-card">
      <div className="vg-card-head vg-card-head--split">
        <div><h3>Booking calendar</h3><p>Days with a shoot on the books</p></div>
        <div className="vg-calendar-nav">
          <button type="button" className="vg-icon-btn" onClick={prevMonth} aria-label="Previous month"><ChevronLeft size={16} /></button>
          <button type="button" className="vg-btn vg-btn--sm" onClick={goToday}>Today</button>
          <span className="vg-calendar-month">{monthLabel}</span>
          <button type="button" className="vg-icon-btn" onClick={nextMonth} aria-label="Next month"><ChevronRight size={16} /></button>
        </div>
      </div>

      <div className="vg-calendar-grid">
        {DOW_LABELS.map((d) => <div className="vg-calendar-dow" key={d}>{d}</div>)}
        {weeks.map((week, wi) => week.map((day, di) => {
          if (day === null) return <div className="vg-calendar-cell vg-calendar-cell--empty" key={`${wi}-${di}`} />;
          const key = dateKey(day);
          const dayBookings = bookedByDate[key] || [];
          const booked = dayBookings.length > 0;
          return (
            <button
              type="button"
              key={key}
              className={`vg-calendar-cell ${booked ? "vg-calendar-cell--booked" : ""} ${key === todayKey ? "vg-calendar-cell--today" : ""}`}
              onClick={booked ? go : undefined}
              title={booked ? dayBookings.map((b) => b.event).join(", ") : ""}
            >
              <span className="vg-calendar-daynum">{day}</span>
              {booked && <span className="vg-calendar-dot" />}
            </button>
          );
        }))}
      </div>
    </div>
  );
}

function ChartTooltip({ active, payload, label }) {
  if (!active || !payload || !payload.length) return null;
  return (
    <div className="vg-tooltip">
      <div className="vg-tooltip-label">{label}</div>
      <div className="vg-tooltip-value">{fmtMoney(payload[0].value)}</div>
    </div>
  );
}
function DonutTooltip({ active, payload }) {
  if (!active || !payload || !payload.length) return null;
  const d = payload[0];
  return (
    <div className="vg-tooltip">
      <div className="vg-tooltip-label">{d.name}</div>
      <div className="vg-tooltip-value">{fmtMoney(d.value)}</div>
    </div>
  );
}

function PageHeader({ title, subtitle, action }) {
  return (
    <div className="vg-page-head">
      <div>
        <h1>{title}</h1>
        <p>{subtitle}</p>
      </div>
      {action}
    </div>
  );
}

/* ================================ LEADS =================================== */

/* Booking requests submitted from the public website's contact form.
   Lives in its own `leads` table (not the studio_data JSON blob) because
   the site inserts into it anonymously — see the RLS policy that only
   allows `anon` to INSERT, never read/update/delete. This page reads and
   manages it live via Supabase directly, same DB, separate table. */
function LeadsPage({ mutate, toast }) {
  const [leads, setLeads] = useState(null); // null = still loading
  const [query, setQuery] = useState("");

  useEffect(() => {
    let alive = true;
    supabase
      .from("leads")
      .select("*")
      .order("created_at", { ascending: false })
      .then(({ data: rows, error }) => {
        if (!alive) return;
        if (error) { console.error("Leads load failed", error); setLeads([]); return; }
        setLeads(rows || []);
      });

    const channel = supabase
      .channel("leads_changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "leads" }, (payload) => {
        setLeads((prev) => {
          if (!prev) return prev;
          if (payload.eventType === "INSERT") return [payload.new, ...prev];
          if (payload.eventType === "UPDATE") return prev.map((l) => (l.id === payload.new.id ? payload.new : l));
          if (payload.eventType === "DELETE") return prev.filter((l) => l.id !== payload.old.id);
          return prev;
        });
      })
      .subscribe();

    return () => { alive = false; supabase.removeChannel(channel); };
  }, []);

  const setStatus = async (lead, status) => {
    const { error } = await supabase.from("leads").update({ status }).eq("id", lead.id);
    if (error) { toast("Couldn't update that lead — try again."); return; }
    toast(status === "contacted" ? "Marked as contacted" : "Marked as converted");
  };

  const convertToClient = (lead) => {
    mutate((d) => ({
      ...d,
      clients: [
        { id: uid(), name: lead.name || "Untitled lead", type: "Individual", email: "", phone: lead.phone || "", kraPin: "", source: "Website", added: todayISO() },
        ...d.clients,
      ],
    }));
    setStatus(lead, "converted");
    toast("Added to Clients");
  };

  const remove = async (lead) => {
    if (!window.confirm("Remove this lead? This can't be undone.")) return;
    const { error } = await supabase.from("leads").delete().eq("id", lead.id);
    if (error) toast("Couldn't remove that lead.");
  };

  const filtered = (leads || []).filter((l) =>
    ((l.name || "") + (l.phone || "") + (l.package || "")).toLowerCase().includes(query.toLowerCase())
  );

  return (
    <div className="vg-page">
      <PageHeader title="Leads" subtitle="Booking requests from the website, newest first" />

      <div className="vg-card vg-card--grow">
        <div className="vg-card-head vg-card-head--split">
          <h3>All leads ({filtered.length})</h3>
          <div className="vg-search">
            <Search size={15} />
            <input placeholder="Search…" value={query} onChange={(e) => setQuery(e.target.value)} />
          </div>
        </div>

        {leads === null ? (
          <div className="vg-empty vg-empty--tight"><Loader2 size={20} className="vg-spin-icon" /></div>
        ) : filtered.length === 0 ? (
          <EmptyState icon={Send} title="No leads yet" body="When someone books a package on the website, it shows up here automatically." />
        ) : (
          <div className="vg-table">
            <div className="vg-tr vg-tr--head vg-tr--leads">
              <div className="vg-td vg-td--wide">Name</div>
              <div className="vg-td">Phone</div>
              <div className="vg-td vg-td--wide">Package</div>
              <div className="vg-td">Status</div>
              <div className="vg-td">Received</div>

                <div className="vg-td vg-td--wide">{l.package || "—"}</div>
                <div className="vg-td"><StatusPill status={l.status || "new"} /></div>
                <div className="vg-td">{fmtDate(l.created_at)}</div>
                <div className="vg-td vg-td--actions">
                  {l.status !== "contacted" && l.status !== "converted" && (

const blankPackageForm = () => ({ name: "", category: "", description: "", price: "", duration: "", deposit: "" });

function PackagesPage({ data, mutate, toast }) {
  const [form, setForm] = useState(blankPackageForm());
  const [editingId, setEditingId] = useState(null);

  const grouped = useMemo(() => {
    const map = {};
    data.packages.forEach((s) => { (map[s.category] ||= []).push(s); });
    return map;
  }, [data.packages]);

  const openEdit = (s) => {
    setEditingId(s.id);
    setForm({
      name: s.name, category: s.category, description: s.description || "",
      price: String(s.price), duration: s.duration || "", deposit: String(s.deposit || ""),
    });
  };

  const cancelEdit = () => { setEditingId(null); setForm(blankPackageForm()); };

  const save = () => {
    if (!form.name.trim() || !form.category.trim() || !form.price) {
      toast("Name, category and price are needed to add a package.");
      return;
    }
    const patch = {
      name: form.name.trim(), category: form.category.trim(),
      description: form.description || "", price: Number(form.price) || 0,
      duration: form.duration || "—", deposit: Number(form.deposit) || 0,
    };
    if (editingId) {
      mutate((d) => ({ ...d, packages: d.packages.map((s) => s.id === editingId ? { ...s, ...patch } : s) }));
      toast("Package updated");
    } else {
      mutate((d) => ({ ...d, packages: [...d.packages, { id: uid(), ...patch }] }));
      toast("Package added");
    }
    cancelEdit();
  };

  const remove = (id) => {
    mutate((d) => ({ ...d, packages: d.packages.filter((s) => s.id !== id) }));
    if (editingId === id) cancelEdit();
    toast("Package removed");
  };

  return (
    <div className="vg-page">
      <PageHeader title="Packages" subtitle="Packages, pricing and deposits" />

      <div className="vg-card">
        <div className="vg-card-head"><h3>{editingId ? "Edit package" : "Add package"}</h3></div>
        <div className="vg-add-service-grid">
          <input className="vg-input" placeholder="Name" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
          <input className="vg-input" placeholder="Category" value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })} />
          <input className="vg-input" placeholder="Price (KES)" type="number" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} />
          <input className="vg-input" placeholder="Duration" value={form.duration} onChange={(e) => setForm({ ...form, duration: e.target.value })} />
          <input className="vg-input" placeholder="Deposit %" type="number" value={form.deposit} onChange={(e) => setForm({ ...form, deposit: e.target.value })} />
        </div>
        <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
          <button className="vg-btn vg-btn--gold" onClick={save}><Plus size={16} />{editingId ? "Save changes" : "Add package"}</button>
          {editingId && <button className="vg-btn vg-btn--ghost" onClick={cancelEdit}>Cancel</button>}
        </div>
      </div>

      {Object.keys(grouped).length === 0 ? (
        <div className="vg-card"><EmptyState icon={Sparkles} title="No packages yet" body="Add your first package above to start quoting clients." /></div>
      ) : Object.entries(grouped).map(([cat, items]) => (
        <div className="vg-card" key={cat}>
          <div className="vg-card-head"><h3>{cat}</h3></div>
          <div className="vg-service-grid">
            {items.map((s) => (
              <div className="vg-service-card" key={s.id}>
                <div className="vg-service-card-actions">
                  <button className="vg-icon-btn" title="Edit package" onClick={() => openEdit(s)}><Pencil size={14} /></button>
                  <button className="vg-icon-btn vg-icon-btn--danger" title="Delete package" onClick={() => remove(s.id)}><Trash2 size={14} /></button>
                </div>
                <div className="vg-service-name">{s.name}</div>
                <div className="vg-service-desc">{s.description}</div>
                <div className="vg-service-foot">
                  <span className="vg-price vg-mono">{fmtMoney(s.price)}</span>
                  <span className="vg-service-meta">{s.duration} · {s.deposit}% deposit</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

const blankBookingExpenseRow = () => ({ id: uid(), category: "Gear hire", description: "", amount: "" });

function BookingsPage({ data, mutate, toast, filter, onFilterChange, onNavigate }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [form, setForm] = useState(null);
  const [isNewBooking, setIsNewBooking] = useState(true);
  const [localFilter, setLocalFilter] = useState(filter || "all");
  const [clientMode, setClientMode] = useState("existing");
  const [newClient, setNewClient] = useState(blankNewClient());
  const [packageMode, setPackageMode] = useState("existing");
  const [newPackage, setNewPackage] = useState(blankPackageForm());

  useEffect(() => { setLocalFilter(filter || "all"); }, [filter]);

  const openNew = () => {
    setForm({
      id: uid(), event: "", category: "Custom", clientId: data.clients[0]?.id || "",
      startDate: todayISO(), endDate: todayISO(), location: "", status: "reserved", gearIds: [], packageId: "",
      expenses: [],
    });
    setClientMode(data.clients.length ? "existing" : "new");
    setNewClient(blankNewClient());
    setPackageMode("existing");
    setNewPackage(blankPackageForm());
    setIsNewBooking(true);
    setModalOpen(true);
  };
  const openEdit = (b) => {
    const linkedExpenses = data.expenses.filter((e) => e.bookingId === b.id).map((e) => ({ ...e, amount: String(e.amount) }));
    setForm({
      ...b, gearIds: b.gearIds || [], packageId: b.packageId || b.serviceId || "",
      startDate: b.startDate || b.date || todayISO(), endDate: b.endDate || b.date || todayISO(),
      expenses: linkedExpenses,
    });
    setClientMode("existing");
    setNewClient(blankNewClient());
    setPackageMode("existing");
    setNewPackage(blankPackageForm());
    setIsNewBooking(false);
    setModalOpen(true);
  };

  const isNew = (id) => !data.bookings.some((b) => b.id === id);

  /* Folds the booking record and its expense rows into the shared store in
     one go — the booking is the single place these get entered, but
     expenses still live in the same data.expenses collection everything
     else (dashboard totals, profit) already reads from. */
  const upsertBookingAndExpenses = (d, f) => {
    const pkg = d.packages.find((s) => s.id === f.packageId);
    const cleanBooking = { ...f, category: pkg ? pkg.category : f.category };
    delete cleanBooking.expenses;
    const bookings = isNew(f.id)
      ? [cleanBooking, ...d.bookings]
      : d.bookings.map((b) => (b.id === f.id ? cleanBooking : b));
    const keptExpenses = (f.expenses || [])
      .filter((e) => e.description.trim() && Number(e.amount) > 0)
      .map((e) => ({
        id: e.id || uid(), category: e.category, description: e.description.trim(),
        amount: Number(e.amount) || 0, date: e.date || todayISO(), projectId: e.projectId || "",
        bookingId: f.id,
      }));
    const expenses = [...d.expenses.filter((e) => e.bookingId !== f.id), ...keptExpenses];
    return { ...d, bookings, expenses };
  };

  const save = () => {
    if (!form.event.trim()) { toast("Add an event name."); return; }
    if (!form.startDate || !form.endDate || form.endDate < form.startDate) { toast("Check the booking dates."); return; }

    let clientId = form.clientId;
    let newClientRecord = null;
    if (clientMode === "new") {
      if (!newClient.name.trim()) { toast("Enter the new client's name."); return; }
      clientId = uid();
      newClientRecord = { ...newClient, id: clientId, source: "Referral", added: todayISO() };
    }
    if (!clientId) { toast("Pick or add a client for this booking."); return; }

    // A package is entirely optional on a booking — picking one (existing or
    // brand new) is what triggers the auto-invoice below; leaving it blank
    // just saves the booking with no package attached.
    let packageId = form.packageId;
    let newPackageRecord = null;
    if (packageMode === "new") {
      if (!newPackage.name.trim()) { toast("Enter a name for the new package."); return; }
      if (!newPackage.price || Number(newPackage.price) <= 0) { toast("Enter a price for the new package."); return; }
      packageId = uid();
      newPackageRecord = {
        id: packageId,
        name: newPackage.name.trim(),
        category: newPackage.category.trim() || "Custom",
        description: newPackage.description || "",
        price: Number(newPackage.price) || 0,
        duration: newPackage.duration || "—",
        deposit: Number(newPackage.deposit) || 0,
      };
    }

    const bookingForm = { ...form, clientId, packageId };
    const svc = newPackageRecord || data.packages.find((s) => s.id === packageId);
    const alreadyInvoiced = !!bookingForm.invoiceId;

    mutate((d) => {
      const withClient = newClientRecord ? { ...d, clients: [newClientRecord, ...d.clients] } : d;
      const withPackage = newPackageRecord ? { ...withClient, packages: [newPackageRecord, ...withClient.packages] } : withClient;
      const withBooking = upsertBookingAndExpenses(withPackage, bookingForm);
      // Auto-send to Invoices & Payments the first time a package is picked —
      // if it's already been invoiced once, saving again just updates the
      // booking/expenses and leaves the existing invoice alone.
      if (!svc || alreadyInvoiced) return withBooking;
      const client = newClientRecord || withClient.clients.find((c) => c.id === clientId);
      const number = `VGI-${String(d.invoiceSeq).padStart(6, "0")}`;
      const invoiceId = uid();
      const invoice = {
        id: invoiceId, number, clientId, total: svc.price, paid: 0,
        date: todayISO(), dueDate: todayISO(), notes: `From booking: ${bookingForm.event}`,
        items: [{ id: uid(), description: svc.name, qty: 1, price: svc.price }],
        status: "unpaid", sent: false, bookingId: bookingForm.id,
      };
      const project = makeProjectFromInvoice({
        client, title: `${bookingForm.event}${client ? ` — ${client.name}` : ""}`,
        shootDate: bookingForm.startDate, invoiceId, bookingId: bookingForm.id,
      });
      return {
        ...withBooking,
        invoiceSeq: d.invoiceSeq + 1,
        invoices: [invoice, ...withBooking.invoices],
        projects: [project, ...withBooking.projects],
        bookings: withBooking.bookings.map((b) => (b.id === bookingForm.id ? { ...b, invoiceId } : b)),
      };
    });

    const addedBits = [newClientRecord && "client added to CRM", newPackageRecord && "package added"].filter(Boolean);
    const action = alreadyInvoiced ? "booking updated" : svc ? "booking saved — invoice and project created" : "booking saved";
    toast(addedBits.length ? `${addedBits.join(" and ")} — ${action}` : action[0].toUpperCase() + action.slice(1));
    setModalOpen(false);
  };

  const setStatus = (id, status) => {
    mutate((d) => ({ ...d, bookings: d.bookings.map((b) => b.id === id ? { ...b, status } : b) }));
    toast("Booking updated");
  };

  const remove = (b) => {
    if (!window.confirm(`Delete booking "${b.event}"? This can't be undone.`)) return;
    mutate((d) => ({
      ...d,
      bookings: d.bookings.filter((x) => x.id !== b.id),
      expenses: d.expenses.filter((e) => e.bookingId !== b.id),
    }));
    toast("Booking deleted");
  };

  const toggleGear = (gearId) => {
    setForm((f) => {
      const has = (f.gearIds || []).includes(gearId);
      return { ...f, gearIds: has ? f.gearIds.filter((g) => g !== gearId) : [...(f.gearIds || []), gearId] };
    });
  };

  const addExpenseRow = () => setForm((f) => ({ ...f, expenses: [...(f.expenses || []), blankBookingExpenseRow()] }));
  const updateExpenseRow = (id, patch) => setForm((f) => ({ ...f, expenses: f.expenses.map((e) => e.id === id ? { ...e, ...patch } : e) }));
  const removeExpenseRow = (id) => setForm((f) => ({ ...f, expenses: f.expenses.filter((e) => e.id !== id) }));

  const setFilter = (v) => { setLocalFilter(v); onFilterChange && onFilterChange(v); };

  const visibleBookings = useMemo(() => {
    if (localFilter === "upcoming") {
      const now = new Date(new Date().toDateString());
      return data.bookings.filter((b) => b.status !== "cancelled" && new Date((b.endDate || b.date || b.startDate) + "T00:00:00") >= now);
    }
    return data.bookings;
  }, [data.bookings, localFilter]);

  const gearConflicts = useMemo(() => computeGearConflicts(data.bookings, data.gear), [data.bookings, data.gear]);
  const conflictedBookingIds = useMemo(() => {
    const ids = new Set();
    gearConflicts.forEach((c) => c.bookings.forEach((b) => ids.add(b.id)));
    return ids;
  }, [gearConflicts]);

  return (
    <div className="vg-page">
      <PageHeader title="Bookings" subtitle="Reservations, shoot dates and confirmations"
        action={<button className="vg-btn vg-btn--gold" onClick={openNew}><Plus size={16} />New booking</button>} />

      {gearConflicts.length > 0 && (
        <div className="vg-alert-banner">
          <AlertTriangle size={16} />
          <div>
            <strong>Gear double-booked</strong>
            <div className="vg-alert-banner-body">
              {gearConflicts.map((c, i) => (
                <div key={i}>
                  {fmtDate(c.date)} — {c.gear.name} needed by {c.needed} bookings, you only own {c.owned}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      <div className="vg-filter-chips">
        {[["all", "All"], ["upcoming", "Upcoming"]].map(([v, label]) => (
          <button key={v} className={`vg-chip ${localFilter === v ? "vg-chip--active" : ""}`} onClick={() => setFilter(v)}>{label}</button>
        ))}
      </div>

      <div className="vg-card vg-card--grow">
        <div className="vg-card-head"><h3>{localFilter === "upcoming" ? "Upcoming" : "All"} bookings ({visibleBookings.length})</h3></div>
        {visibleBookings.length === 0 ? (
          <EmptyState icon={CalendarDays} title="No bookings yet" body="Reserve a shoot date for a client to see it listed here." actionLabel="New booking" onAction={openNew} />
        ) : (
          <div className="vg-table">
            <div className="vg-tr vg-tr--head vg-tr--bookings">
              <div className="vg-td vg-td--wide">Event</div>
              <div className="vg-td vg-td--wide">Client</div>
              <div className="vg-td">Dates</div>
              <div className="vg-td vg-td--wide">Location</div>
              <div className="vg-td">Status</div>
              <div className="vg-td">Update</div>
              <div className="vg-td vg-td--actions" />
            </div>
            {visibleBookings.map((b) => {
              const client = data.clients.find((c) => c.id === b.clientId);
              const gearNames = (b.gearIds || []).map((id) => data.gear.find((g) => g.id === id)?.name).filter(Boolean);
              return (
                <div className="vg-tr vg-tr--bookings" key={b.id}>
                  <div className="vg-td vg-td--wide">
                    <button className="vg-cell-title vg-link-title" onClick={() => openEdit(b)} style={{ display: "block", width: "100%" }}>{b.event}</button>
                    <div className="vg-cell-sub">{b.category}{gearNames.length ? ` · ${gearNames.join(", ")}` : ""}</div>
                    {conflictedBookingIds.has(b.id) && <div className="vg-cell-sub vg-cell-sub--danger">Gear conflict</div>}
                    {b.invoiceId && <div className="vg-cell-sub">Invoiced</div>}
                  </div>
                  <div className="vg-td vg-td--wide">{client ? client.name : "—"}</div>
                  <div className="vg-td">{fmtBookingDates(b)}</div>
                  <div className="vg-td vg-td--wide">{b.location}</div>
                  <div className="vg-td"><StatusPill status={b.status} /></div>
                  <div className="vg-td">
                    <StatusSelect value={b.status} options={BOOKING_STATUSES} onChange={(v) => setStatus(b.id, v)} />
                  </div>
                  <div className="vg-td vg-td--actions">
                    <button className="vg-icon-btn" title="Edit booking" onClick={() => openEdit(b)}><Pencil size={15} /></button>
                    <button className="vg-icon-btn vg-icon-btn--danger" title="Delete booking" onClick={() => remove(b)}><Trash2 size={15} /></button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={isNewBooking ? "New booking" : "Edit booking"} width={560}>
        {form && (
          <div className="vg-form-grid">
            <Field label="Event"><input className="vg-input" value={form.event} onChange={(e) => setForm({ ...form, event: e.target.value })} placeholder="e.g. Wedding" /></Field>
            <ClientPicker
              clients={data.clients}
              mode={clientMode}
              onModeChange={setClientMode}
              clientId={form.clientId}

/* ============================== EQUIPMENT ================================== */
/* Two distinct things live here, on purpose:
   1. The equipment CATALOG — items available to hire out (photos, price,
      serial, condition). Adding/editing/deleting one never touches a
      customer.
   2. A HIRE — a transaction: pick a customer, pick catalog equipment,
      pick dates. Saving a hire is the only thing that raises an invoice,
      and it's always for the full amount up front — no partial deposit,
      the equipment doesn't go out until it's paid in full. */

const EQUIPMENT_CATEGORIES = ["Camera", "Lens", "Lighting", "Audio", "Stabiliser"];
const EQUIPMENT_STATUSES = ["available", "out", "maintenance"];
const HIRE_STATUSES = ["reserved", "out", "returned"];
const MAX_EQUIPMENT_PHOTOS = 4;

const blankEquipment = () => ({
  id: null, name: "", category: "Camera", photos: [], serial: "",
  dailyRate: "", status: "available", conditionNotes: "",
});

const blankHireForm = () => ({
  id: null, clientId: "", items: [], startDate: todayISO(), endDate: todayISO(), status: "reserved",
});

const hireDays = (start, end) => {
  if (!start || !end) return 1;
  const d = Math.round((new Date(end + "T00:00:00") - new Date(start + "T00:00:00")) / 86400000) + 1;
  return Math.max(1, d);
};

const hireTotal = (h, equipmentList) => {
  const days = hireDays(h.startDate, h.endDate);
  return (h.items || []).reduce((sum, it) => {
    const eq = equipmentList.find((e) => e.id === it.equipmentId);
    return sum + (eq ? (Number(eq.dailyRate) || 0) * (it.qty || 0) : 0);
  }, 0) * days;
};

/* A hire is overdue once it's still out with the customer past its return
   date — reserved and already-returned hires are never overdue. */
const isHireOverdue = (h) => h.status === "out" && !!h.endDate && h.endDate < todayISO();
const effectiveHireStatus = (h) => (isHireOverdue(h) ? "overdue" : h.status);

/* Swipeable/scrollable full-size viewer for an equipment item's photos —
   opened by tapping the photo area on a catalog card. Scrolls horizontally
   (touch swipe or the arrow buttons) through all photos for that item.

   The scroll-position listener and the "scroll to this index" effect can
   easily fight each other: a smooth programmatic scroll fires its own
   intermediate scroll events, which — if read immediately — report the
   wrong index mid-flight and re-trigger another scroll, which is what was
   making this choppy and made the arrow buttons look like they'd stopped
   working. Two things fix it: only read the scroll position once it has
   actually settled (debounced), and ignore scroll events entirely while a
   programmatic (button/dot triggered) scroll is still in flight. */
function PhotoLightbox({ photos, index, onIndexChange }) {
  const trackRef = useRef(null);
  const settleTimer = useRef(null);
  const programmatic = useRef(false);
  const programmaticTimer = useRef(null);

  useEffect(() => {
    const el = trackRef.current;
    if (!el || !el.clientWidth) return;
    const target = index * el.clientWidth;
    if (Math.abs(el.scrollLeft - target) < 2) return;
    programmatic.current = true;
    el.scrollTo({ left: target, behavior: "smooth" });
    if (programmaticTimer.current) clearTimeout(programmaticTimer.current);
    programmaticTimer.current = setTimeout(() => { programmatic.current = false; }, 450);
  }, [index]);

  useEffect(() => () => {
    if (settleTimer.current) clearTimeout(settleTimer.current);
    if (programmaticTimer.current) clearTimeout(programmaticTimer.current);
  }, []);

  const handleScroll = () => {
    if (programmatic.current) return;
    if (settleTimer.current) clearTimeout(settleTimer.current);
    settleTimer.current = setTimeout(() => {
      const el = trackRef.current;
      if (!el || !el.clientWidth) return;
      const i = Math.round(el.scrollLeft / el.clientWidth);
      if (i !== index) onIndexChange(i);
    }, 100);
  };

  const goTo = (i) => onIndexChange(Math.max(0, Math.min(photos.length - 1, i)));

  return (
    <div className="vg-lightbox">
      <div className="vg-lightbox-track" ref={trackRef} onScroll={handleScroll}>
        {photos.map((src, i) => (
          <div className="vg-lightbox-slide" key={i}><img src={src} alt={`Photo ${i + 1} of ${photos.length}`} draggable={false} /></div>
        ))}
      </div>
      {photos.length > 1 && (
        <>
          <button type="button" className="vg-lightbox-nav vg-lightbox-nav--prev" onClick={() => goTo(index - 1)} disabled={index === 0} aria-label="Previous photo"><ChevronLeft size={20} /></button>
          <button type="button" className="vg-lightbox-nav vg-lightbox-nav--next" onClick={() => goTo(index + 1)} disabled={index === photos.length - 1} aria-label="Next photo"><ChevronRight size={20} /></button>
          <div className="vg-lightbox-dots">
            {photos.map((_, i) => (
              <button type="button" key={i} className={`vg-lightbox-dot ${i === index ? "vg-lightbox-dot--active" : ""}`} onClick={() => goTo(i)} aria-label={`Go to photo ${i + 1}`} />
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function EquipmentPage({ data, mutate, toast }) {
  const [equipModalOpen, setEquipModalOpen] = useState(false);
  const [equipForm, setEquipForm] = useState(null);
  const equipFileInputRef = useRef(null);
  const [lightbox, setLightbox] = useState(null); // { eq, index }

  const [hireModalOpen, setHireModalOpen] = useState(false);
  const [hireForm, setHireForm] = useState(null);
  const [clientMode, setClientMode] = useState("existing");
  const [newClient, setNewClient] = useState(blankNewClient());

  /* ---------------- equipment catalog: add / edit / delete ---------------- */

  const openNewEquipment = () => { setEquipForm(blankEquipment()); setEquipModalOpen(true); };
  const openEditEquipment = (eq) => { setEquipForm({ ...eq, dailyRate: String(eq.dailyRate) }); setEquipModalOpen(true); };

  const addPhotos = (fileList) => {
    const files = Array.from(fileList || []);
    if (files.length === 0) return;
    const remaining = MAX_EQUIPMENT_PHOTOS - equipForm.photos.length;
    if (remaining <= 0) { toast(`You can add up to ${MAX_EQUIPMENT_PHOTOS} photos.`); return; }
    const toAdd = files.slice(0, remaining);
    if (files.length > remaining) toast(`Only added ${remaining} photo${remaining > 1 ? "s" : ""} — ${MAX_EQUIPMENT_PHOTOS} max.`);
    Promise.all(toAdd.map(readAndCompressImage)).then((dataUrls) => {
      setEquipForm((f) => ({ ...f, photos: [...f.photos, ...dataUrls] }));
    }).catch(() => toast("Couldn't read one of those photos — try again."));
  };
  const removePhoto = (idx) => setEquipForm((f) => ({ ...f, photos: f.photos.filter((_, i) => i !== idx) }));

  const saveEquipment = () => {
    if (!equipForm.name.trim()) { toast("Give the equipment a name."); return; }
    const rate = Number(equipForm.dailyRate) || 0;
    if (rate <= 0) { toast("Enter a daily hire rate."); return; }
    const clean = { ...equipForm, dailyRate: rate };
    if (equipForm.id) {
      mutate((d) => ({ ...d, equipment: d.equipment.map((e) => e.id === equipForm.id ? clean : e) }));
      toast("Equipment updated");
    } else {
      mutate((d) => ({ ...d, equipment: [{ ...clean, id: uid() }, ...d.equipment] }));
      toast("Equipment added");
    }
    setEquipModalOpen(false);
  };

  const removeEquipment = (eq) => {
    if (!window.confirm(`Delete "${eq.name}" from the equipment catalog? This can't be undone.`)) return;
    mutate((d) => ({
      ...d,
      equipment: d.equipment.filter((e) => e.id !== eq.id),
      hires: d.hires.map((h) => h.items?.some((it) => it.equipmentId === eq.id) ? { ...h, items: h.items.filter((it) => it.equipmentId !== eq.id) } : h),
    }));
    toast("Equipment removed");
  };

  /* -------------------------- hires: new / status / delete ------------------ */

  const openNewHire = () => {
    setHireForm(blankHireForm());
    setClientMode(data.clients.length ? "existing" : "new");
    setNewClient(blankNewClient());
    setHireModalOpen(true);
  };

  const setHireQty = (equipmentId, qty) => {
    setHireForm((f) => {
      const rest = f.items.filter((it) => it.equipmentId !== equipmentId);
      return { ...f, items: qty > 0 ? [...rest, { equipmentId, qty }] : rest };
    });
  };

  const saveHire = () => {
    if (hireForm.items.length === 0) { toast("Select at least one piece of equipment."); return; }
    if (!hireForm.startDate || !hireForm.endDate || hireForm.endDate < hireForm.startDate) { toast("Check the hire dates."); return; }

    let clientId = hireForm.clientId;
    let newClientRecord = null;
    if (clientMode === "new") {
      if (!newClient.name.trim()) { toast("Enter the customer's name."); return; }
      clientId = uid();
      newClientRecord = { ...newClient, id: clientId, source: "Referral", added: todayISO() };
    }
    if (!clientId) { toast("Pick or add a customer for this hire."); return; }

    const days = hireDays(hireForm.startDate, hireForm.endDate);
    const equipmentIds = hireForm.items.map((it) => it.equipmentId);

    mutate((d) => {
      const withClient = newClientRecord ? { ...d, clients: [newClientRecord, ...d.clients] } : d;
      const chosen = hireForm.items
        .map((it) => ({ ...it, equipment: withClient.equipment.find((e) => e.id === it.equipmentId) }))
        .filter((x) => x.equipment);
      const total = chosen.reduce((sum, x) => sum + (Number(x.equipment.dailyRate) || 0) * x.qty, 0) * days;
      const hireId = uid();
      const number = `VGI-${String(d.invoiceSeq).padStart(6, "0")}`;
      const invoice = {
        id: uid(), number, clientId, total, paid: 0,
        date: todayISO(), dueDate: todayISO(),
        notes: `Equipment hire — ${chosen.map((x) => `${x.equipment.name}${x.qty > 1 ? ` ×${x.qty}` : ""}`).join(", ")} (${days} day${days > 1 ? "s" : ""}). Paid in full before equipment is released; no partial deposit.`,
        items: chosen.map((x) => ({
          id: uid(),
          description: `${x.equipment.name} hire — ${days} day${days > 1 ? "s" : ""} @ ${fmtMoney(x.equipment.dailyRate)}/day`,
          qty: x.qty, price: (Number(x.equipment.dailyRate) || 0) * days,
        })),
        status: "unpaid", sent: false, hireId,
      };
      const hire = { id: hireId, clientId, items: hireForm.items, startDate: hireForm.startDate, endDate: hireForm.endDate, status: hireForm.status, invoiceId: invoice.id };
      return {
        ...withClient,
        invoiceSeq: d.invoiceSeq + 1,
        invoices: [invoice, ...withClient.invoices],
        hires: [hire, ...withClient.hires],
        equipment: withClient.equipment.map((e) => equipmentIds.includes(e.id) && hireForm.status === "out" ? { ...e, status: "out" } : e),
      };
    });
    toast(newClientRecord ? "Customer added to CRM — hire saved and invoice generated" : "Hire saved — invoice generated for full payment");
    setHireModalOpen(false);
  };

  const setHireStatus = (h, status) => {
    const equipmentIds = h.items.map((it) => it.equipmentId);
    mutate((d) => ({
      ...d,
      hires: d.hires.map((x) => x.id === h.id ? { ...x, status } : x),
      equipment: d.equipment.map((e) => {
        if (!equipmentIds.includes(e.id)) return e;
        if (status === "out") return { ...e, status: "out" };
        if (status === "returned") return { ...e, status: "available" };
        return e;
      }),
    }));
  };

  const removeHire = (h) => {
    if (!window.confirm("Delete this hire record? This can't be undone.")) return;
    const equipmentIds = h.items.map((it) => it.equipmentId);
    mutate((d) => ({
      ...d,
      hires: d.hires.filter((x) => x.id !== h.id),
      equipment: d.equipment.map((e) => equipmentIds.includes(e.id) ? { ...e, status: "available" } : e),
    }));
    toast("Hire deleted");
  };

  return (
    <div className="vg-page">
      <PageHeader title="Equipment" subtitle="Your hireable gear catalog, and every hire you've booked out"
        action={
          <div style={{ display: "flex", gap: 8 }}>
            <button className="vg-btn vg-btn--ghost" onClick={openNewHire}><Plus size={16} />New hire</button>
            <button className="vg-btn vg-btn--gold" onClick={openNewEquipment}><Plus size={16} />Add equipment</button>
          </div>
        } />

      <div className="vg-card vg-card--grow">
        <div className="vg-card-head"><h3>Hires ({data.hires.length})</h3></div>
        {data.hires.length === 0 ? (
          <EmptyState icon={Send} title="No hires yet" body="Pick a customer and equipment from your catalog to raise a full-payment invoice." actionLabel="New hire" onAction={openNewHire} />
        ) : (
          <div className="vg-table">
            <div className="vg-tr vg-tr--head vg-tr--hires">
              <div className="vg-td vg-td--wide">Customer</div>
              <div className="vg-td vg-td--wide">Equipment</div>
              <div className="vg-td">Dates</div>
              <div className="vg-td">Total</div>
              <div className="vg-td">Status</div>
              <div className="vg-td">Invoice</div>
              <div className="vg-td vg-td--actions" />
            </div>
            {data.hires.map((h) => {
              const client = data.clients.find((c) => c.id === h.clientId);
              const lineLabels = h.items.map((it) => {
                const eq = data.equipment.find((e) => e.id === it.equipmentId);
                return eq ? `${eq.name}${it.qty > 1 ? ` ×${it.qty}` : ""}` : null;
              }).filter(Boolean);
              const invoice = data.invoices.find((inv) => inv.id === h.invoiceId);
              return (
                <div className="vg-tr vg-tr--hires" key={h.id}>
                  <div className="vg-td vg-td--wide">{client ? client.name : "—"}</div>
                  <div className="vg-td vg-td--wide">{lineLabels.join(", ") || "—"}</div>
                  <div className="vg-td">{fmtDate(h.startDate)} → {fmtDate(h.endDate)}</div>
                  <div className="vg-td vg-mono">{fmtMoney(hireTotal(h, data.equipment))}</div>
                  <div className="vg-td">
                    <StatusSelect value={h.status} options={HIRE_STATUSES} onChange={(v) => setHireStatus(h, v)} />
                    {isHireOverdue(h) && <div className="vg-cell-sub vg-cell-sub--danger">{daysBetween(h.endDate)}d overdue</div>}
                  </div>
                  <div className="vg-td">{invoice ? <span className={`vg-pill vg-pill--${effectiveInvoiceStatus(invoice)}`}>{effectiveInvoiceStatus(invoice)}</span> : "—"}</div>
                  <div className="vg-td vg-td--actions">
                    <button className="vg-icon-btn vg-icon-btn--danger" title="Delete hire" onClick={() => removeHire(h)}><Trash2 size={15} /></button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div className="vg-card vg-card--grow">
        <div className="vg-card-head"><h3>Catalog ({data.equipment.length})</h3></div>
        {data.equipment.length === 0 ? (
          <EmptyState icon={Camera} title="No equipment added yet" body="Add the cameras, lenses and gear you hire out, with photos and a daily rate." actionLabel="Add equipment" onAction={openNewEquipment} />
        ) : (
          <div className="vg-equip-grid">
            {data.equipment.map((eq) => (
              <div className="vg-card vg-equip-card" key={eq.id}>
                <div
                  className={`vg-hire-photo ${eq.photos.length > 0 ? "vg-hire-photo--clickable" : ""}`}
                  onClick={() => eq.photos.length > 0 && setLightbox({ eq, index: 0 })}
                  role={eq.photos.length > 0 ? "button" : undefined}
                  aria-label={eq.photos.length > 0 ? `View photos of ${eq.name}` : undefined}
                >
                  {eq.photos.length === 0 ? (
                    <div className="vg-hire-photo-placeholder"><Camera size={22} strokeWidth={1.5} /></div>
                  ) : eq.photos.length === 1 ? (
                    <img src={eq.photos[0]} alt={eq.name} />
                  ) : (
                    <div className="vg-equip-photo-grid">
                      {eq.photos.slice(0, 4).map((src, i) => <img key={i} src={src} alt="" />)}
                    </div>
                  )}
                </div>
                <div className="vg-hire-body">
                  <div className="vg-project-head">
                    <div>
                      <div className="vg-project-title">{eq.name}</div>
                      <div className="vg-cell-sub">{eq.category}{eq.serial ? ` · ${eq.serial}` : ""}</div>
                    </div>
                    <div className="vg-project-head-right">
                      <StatusPill status={eq.status} />
                      <button className="vg-icon-btn" title="Edit equipment" onClick={() => openEditEquipment(eq)}><Pencil size={15} /></button>
                      <button className="vg-icon-btn vg-icon-btn--danger" title="Delete equipment" onClick={() => removeEquipment(eq)}><Trash2 size={15} /></button>
                    </div>
                  </div>
                  <div className="vg-pay-balance">
                    <span>Daily rate</span>
                    <span className="vg-mono">{fmtMoney(eq.dailyRate)}/day</span>
                  </div>
                  {eq.conditionNotes && <div className="vg-cell-sub">{eq.conditionNotes}</div>}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* ---------------- equipment add/edit modal ---------------- */}
      <Modal open={equipModalOpen} onClose={() => setEquipModalOpen(false)} title={equipForm?.id ? "Edit equipment" : "Add equipment"}>
        {equipForm && (
          <div className="vg-form-grid">
            <Field label={`Photos (${equipForm.photos.length}/${MAX_EQUIPMENT_PHOTOS})`}>
              <div className="vg-photo-grid">
                {equipForm.photos.map((src, i) => (
                  <div className="vg-photo-slot" key={i}>
                    <img src={src} alt="" />
