.vg-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--c-border); background: var(--c-surface-2); color: var(--c-text); font-size: 13.5px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease; }
.vg-btn:hover { transform: translateY(-1px); }
.vg-btn:active { transform: translateY(0); }
.vg-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.vg-btn--gold { background: linear-gradient(180deg, var(--c-gold-bright), var(--c-gold)); border-color: transparent; color: #1b1508; box-shadow: 0 10px 22px -12px rgba(201,162,75,0.55); }
.vg-btn--gold:hover { box-shadow: 0 14px 26px -12px rgba(201,162,75,0.7); }
.vg-btn--ghost { background: transparent; }
.vg-btn--ghost:hover { background: var(--c-surface-2); }
.vg-btn--block { width: 100%; margin-top: 4px; }
.vg-btn--sm { padding: 7px 12px; font-size: 12.5px; }
.vg-icon-btn { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9px; background: var(--c-surface-2); border: 1px solid var(--c-border); color: var(--c-muted-strong); cursor: pointer; transition: all 0.15s ease; }
.vg-icon-btn:hover { color: var(--c-text); border-color: var(--c-gold); }
.vg-icon-btn--danger:hover { color: var(--c-danger); border-color: var(--c-danger); }
.vg-icon-btn--active { color: var(--c-gold-bright); border-color: var(--c-gold); background: rgba(201,162,75,0.14); }

/* ---------- forms ---------- */
.vg-field { display: flex; flex-direction: column; gap: 6px; }
.vg-field-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--c-muted); }
.vg-input { background: var(--c-bg-elev); border: 1px solid var(--c-border); border-radius: 9px; padding: 10px 12px; color: var(--c-text); font-family: 'Inter', sans-serif; font-size: 13.5px; outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease; width: 100%; }
.vg-input:focus { border-color: var(--c-gold); box-shadow: 0 0 0 3px rgba(201,162,75,0.15); }
.vg-input--num { max-width: 82px; text-align: center; }
.vg-form-grid { display: flex; flex-direction: column; gap: 14px; }
.vg-add-service-grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr 0.8fr; gap: 12px; }
@media (max-width: 760px) { .vg-add-service-grid { grid-template-columns: 1fr 1fr; } }

.vg-select-wrap { position: relative; display: inline-flex; align-items: center; }
.vg-select { appearance: none; background: var(--c-bg-elev); border: 1px solid var(--c-border); border-radius: 9px; padding: 9px 30px 9px 12px; color: var(--c-text); font-size: 13px; font-family: 'Inter', sans-serif; cursor: pointer; outline: none; width: 100%; transition: border-color 0.15s ease; }
.vg-select:focus { border-color: var(--c-gold); }
.vg-select-chevron { position: absolute; right: 10px; pointer-events: none; color: var(--c-muted); }

.vg-category-select { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.vg-category-select .vg-select-wrap { width: 100%; }
.vg-category-add-row { display: flex; align-items: center; gap: 6px; animation: vg-fade-in 0.15s ease both; }
.vg-category-add-row .vg-input { flex: 1; }
.vg-category-manage { display: flex; flex-direction: column; gap: 4px; background: var(--c-surface-2); border: 1px solid var(--c-border-soft); border-radius: 10px; padding: 8px; animation: vg-fade-in 0.15s ease both; }
.vg-category-manage-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px; font-size: 13px; border-radius: 7px; }
.vg-category-manage-row:hover { background: var(--c-bg-elev); }

.vg-search { display: flex; align-items: center; gap: 8px; background: var(--c-bg-elev); border: 1px solid var(--c-border); border-radius: 9px; padding: 8px 12px; color: var(--c-muted); width: 220px; }
.vg-search input { background: none; border: none; outline: none; color: var(--c-text); font-size: 13px; width: 100%; font-family: 'Inter', sans-serif; }

/* ---------- pills / status ---------- */
.vg-pill { display: inline-flex; align-items: center; padding: 4px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 600; text-transform: capitalize; border: 1px solid transparent; }
.vg-pill--reserved, .vg-pill--planning, .vg-pill--shooting { background: rgba(201,162,75,0.14); color: var(--c-gold-bright); border-color: rgba(201,162,75,0.3); }
.vg-pill--confirmed, .vg-pill--editing, .vg-pill--out { background: rgba(90,140,220,0.14); color: #8fb4ea; border-color: rgba(90,140,220,0.3); }
.vg-pill--completed, .vg-pill--paid, .vg-pill--accepted, .vg-pill--returned, .vg-pill--available { background: rgba(78,159,110,0.14); color: #7fcb9a; border-color: rgba(78,159,110,0.3); }
.vg-pill--cancelled, .vg-pill--overdue, .vg-pill--expired { background: rgba(193,85,74,0.14); color: #e39089; border-color: rgba(193,85,74,0.3); }
.vg-pill--partial, .vg-pill--draft, .vg-pill--invoiced, .vg-pill--unpaid, .vg-pill--maintenance { background: rgba(201,162,75,0.1); color: var(--c-warn); border-color: rgba(201,162,75,0.25); }
.vg-pill--new { background: rgba(90,140,220,0.14); color: #8fb4ea; border-color: rgba(90,140,220,0.3); }
.vg-pill--contacted { background: rgba(201,162,75,0.14); color: var(--c-gold-bright); border-color: rgba(201,162,75,0.3); }
.vg-pill--converted { background: rgba(78,159,110,0.14); color: #7fcb9a; border-color: rgba(78,159,110,0.3); }

/* ---------- tables ---------- */
.vg-table { display: flex; flex-direction: column; }
.vg-tr { display: grid; gap: 10px; align-items: center; padding: 14px 6px; border-top: 1px solid var(--c-border-soft); }
.vg-tr:first-child { border-top: none; }
.vg-tr--clients { grid-template-columns: 1.5fr 1.7fr 0.9fr 0.8fr 0.9fr 0.7fr; }
.vg-tr--leads { grid-template-columns: 1.8fr 1fr 1.3fr 0.9fr 0.9fr 0.8fr; }
.vg-tr--bookings { grid-template-columns: 1.1fr 1.3fr 0.8fr 1.4fr 0.8fr 1fr auto; }
.vg-tr--quotations { grid-template-columns: 0.9fr 1.4fr 1fr 0.9fr 0.8fr 1.7fr; }
.vg-tr--invoices { grid-template-columns: 0.85fr 1.3fr 0.85fr 0.85fr 0.9fr 0.85fr 0.8fr 1.1fr; }
.vg-tr--expenses { grid-template-columns: 0.8fr 0.9fr 1.5fr 1.3fr 0.8fr 0.8fr; }
.vg-tr--yearmonths { grid-template-columns: 0.8fr 1fr 1fr 1fr; }
.vg-tr--clickable { width: 100%; background: none; border: none; border-top: 1px solid var(--c-border-soft); cursor: pointer; font: inherit; color: inherit; text-align: left; transition: background 0.15s ease; }
.vg-tr--clickable:first-of-type { border-top: none; }
.vg-tr--clickable:hover { background: var(--c-surface-2); }
.vg-tr--gear { grid-template-columns: 1.5fr 1fr 0.8fr 0.8fr; }
.vg-tr--head { color: var(--c-muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.09em; padding-bottom: 10px; }
.vg-td { font-size: 13.5px; min-width: 0; }
.vg-td--wide { grid-column: span 1; }
.vg-td--actions { display: flex; gap: 6px; justify-content: flex-end; }
.vg-td--actions-wide { display: flex; gap: 8px; flex-wrap: wrap; grid-column: span 1; }
.vg-cell-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vg-cell-sub { font-size: 12px; color: var(--c-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vg-cell-sub--danger { color: #e39089; font-weight: 600; }

/* ---------- alert banner (overdue / expired / gear conflicts) ---------- */
.vg-alert-banner { display: flex; gap: 12px; align-items: flex-start; background: rgba(193,85,74,0.1); border: 1px solid rgba(193,85,74,0.3); color: #e39089; border-radius: 12px; padding: 13px 16px; }
.vg-alert-banner svg { flex-shrink: 0; margin-top: 2px; }
.vg-alert-banner strong { display: block; color: var(--c-text); font-size: 13.5px; margin-bottom: 4px; }
.vg-alert-banner-body { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: #e39089; }
.vg-alert-link { background: none; border: none; padding: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: rgba(227,144,137,0.4); }
.vg-alert-link:hover { text-decoration-color: #e39089; }

/* ---------- gear checkbox list (booking form) ---------- */
.vg-gear-check-list { display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; }
.vg-gear-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--c-text); cursor: pointer; }
.vg-gear-check input { accent-color: var(--c-gold); width: 15px; height: 15px; }

/* ---------- inline expenses editor (booking form) ---------- */
.vg-booking-expenses { display: flex; flex-direction: column; gap: 8px; }
.vg-booking-expense-row { display: grid; grid-template-columns: 1fr 1.4fr 0.8fr auto; gap: 8px; align-items: center; }
@media (max-width: 560px) { .vg-booking-expense-row { grid-template-columns: 1fr 1fr; grid-template-areas: "cat cat" "desc desc" "amt del"; } }

.vg-link-title { background: none; border: none; padding: 0; font: inherit; color: var(--c-text); font-weight: 600; cursor: pointer; text-align: left; }
.vg-link-title:hover { color: var(--c-gold-bright); text-decoration: underline; }
.vg-amount { color: var(--c-gold-bright); font-weight: 600; }
@media (max-width: 1000px) {
  .vg-tr { grid-template-columns: 1fr 1fr; row-gap: 6px; }
  .vg-tr--head { display: none; }
  .vg-td--actions, .vg-td--actions-wide { grid-column: 1 / -1; justify-content: flex-start; }
}

/* ---------- packages ---------- */
.vg-service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 900px) { .vg-service-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .vg-service-grid { grid-template-columns: 1fr; } }
.vg-service-card { position: relative; background: var(--c-bg-elev); border: 1px solid var(--c-border); border-radius: 13px; padding: 18px; transition: border-color 0.15s ease, transform 0.15s ease; }
.vg-service-card:hover { border-color: var(--c-gold); transform: translateY(-2px); }
.vg-service-card-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; opacity: 0; transition: opacity 0.15s ease; }
.vg-service-card-actions .vg-icon-btn { width: 28px; height: 28px; }
.vg-service-card:hover .vg-service-card-actions { opacity: 1; }
@media (hover: none) { .vg-service-card-actions { opacity: 1; } }
.vg-service-name { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; margin-bottom: 6px; padding-right: 20px; }
.vg-service-desc { font-size: 12.5px; color: var(--c-muted); line-height: 1.5; min-height: 32px; }
.vg-service-foot { display: flex; align-items: baseline; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--c-border-soft); }
.vg-price { color: var(--c-gold-bright); font-weight: 600; font-size: 15px; }
.vg-service-meta { font-size: 11.5px; color: var(--c-muted); }

/* ---------- projects ---------- */
.vg-project-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
@media (max-width: 900px) { .vg-project-grid { grid-template-columns: 1fr; } }
.vg-project-card { display: flex; flex-direction: column; gap: 12px; }
.vg-project-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.vg-project-head-right { display: flex; align-items: center; gap: 8px; }
.vg-project-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; }
.vg-project-dates { font-size: 12px; color: var(--c-muted); display: flex; gap: 6px; }
.vg-dot-sep { opacity: 0.5; }
.vg-progress-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--c-muted-strong); margin-top: 4px; }
.vg-progress-track { position: relative; height: 8px; border-radius: 6px; background: var(--c-surface-2); overflow: hidden; }
.vg-progress-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--c-gold), var(--c-gold-bright)); transition: width 0.5s cubic-bezier(.2,.8,.2,1); }
.vg-progress-ticks { position: absolute; inset: 0; display: flex; justify-content: space-between; padding: 0 1px; }
.vg-progress-ticks span { width: 1px; background: rgba(0,0,0,0.18); }
.vg-project-controls { display: flex; gap: 10px; margin-top: 4px; }
.vg-project-controls .vg-select-wrap { flex: 1; }

/* ---------- equipment catalog ---------- */
.vg-equip-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
@media (max-width: 900px) { .vg-equip-grid { grid-template-columns: 1fr; } }
.vg-equip-card { padding: 0; overflow: hidden; }
.vg-hire-photo { width: 100%; height: 150px; background: var(--c-surface-2); overflow: hidden; }
.vg-hire-photo--clickable { cursor: pointer; }
.vg-hire-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vg-hire-photo-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--c-muted); }
.vg-equip-photo-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; width: 100%; height: 100%; }
.vg-equip-photo-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vg-hire-body { display: flex; flex-direction: column; gap: 12px; padding: 16px; }

/* photo upload slots, used on the Add/Edit equipment form (up to 4 photos) */
.vg-photo-grid { display: flex; gap: 8px; flex-wrap: wrap; }
.vg-photo-slot { position: relative; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; background: var(--c-surface-2); border: 1px solid var(--c-border); }
.vg-photo-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vg-photo-slot--add { display: flex; align-items: center; justify-content: center; color: var(--c-muted); cursor: pointer; border-style: dashed; }
.vg-photo-slot--add:hover { border-color: var(--c-gold); color: var(--c-gold); }
.vg-modal--lightbox { background: transparent; }
.vg-lightbox { position: relative; }
.vg-lightbox-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; border-radius: 12px; scrollbar-width: none; }
.vg-lightbox-track::-webkit-scrollbar { display: none; }
.vg-lightbox-slide { flex: 0 0 100%; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; background: var(--c-surface-2); min-height: 260px; }
.vg-lightbox-slide img { width: 100%; max-height: 62vh; object-fit: contain; display: block; }
.vg-lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.55); color: #fff; border: none; width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.vg-lightbox-nav:disabled { opacity: 0.25; cursor: default; }
.vg-lightbox-nav--prev { left: 10px; }
.vg-lightbox-nav--next { right: 10px; }
.vg-lightbox-dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
.vg-lightbox-dot { width: 7px; height: 7px; padding: 0; border-radius: 999px; background: var(--c-border); border: none; cursor: pointer; }
.vg-lightbox-dot--active { background: var(--c-gold); }
.vg-photo-remove { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: rgba(6,6,7,0.7); color: #fff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }

/* equipment picker inside the New hire modal */
.vg-hire-equip-list { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow-y: auto; border: 1px solid var(--c-border-soft); border-radius: 10px; padding: 6px; }
.vg-hire-equip-row { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 8px; }
.vg-hire-equip-row:hover { background: var(--c-surface-2); }
.vg-hire-equip-row--disabled { opacity: 0.5; }
.vg-hire-equip-name { flex: 1; font-size: 13.5px; }
.vg-input--qty { width: 56px; flex: none; text-align: center; padding: 6px 4px; }

/* ---------- hires table ---------- */
.vg-tr--hires { grid-template-columns: 1.2fr 1.6fr 1.3fr 0.9fr 1.1fr 0.9fr auto; }

/* ---------- history ---------- */
.vg-history { display: flex; flex-direction: column; }
.vg-history-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 4px; border-top: 1px solid var(--c-border-soft); }
.vg-history-row:first-child { border-top: none; }
.vg-history-row-right { display: flex; align-items: center; gap: 8px; }
.vg-pay-balance { display: flex; justify-content: space-between; align-items: center; background: var(--c-surface-2); border-radius: 10px; padding: 12px 14px; font-size: 13px; }

/* ---------- invoice generator ---------- */
.vg-link { background: none; border: none; padding: 0; color: var(--c-gold-bright); font-family: 'IBM Plex Mono', monospace; font-size: 13px; cursor: pointer; text-decoration: none; }
.vg-link:hover { text-decoration: underline; }
.vg-form-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; }
@media (max-width: 620px) { .vg-form-row { grid-template-columns: 1fr; } }
.vg-items { display: flex; flex-direction: column; gap: 8px; }
.vg-items-head { display: grid; grid-template-columns: 1.6fr 1.3fr 0.6fr 0.9fr 30px; gap: 8px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--c-muted); padding: 0 2px; }
.vg-items-row { display: grid; grid-template-columns: 1.6fr 1.3fr 0.6fr 0.9fr 30px; gap: 8px; align-items: center; }
@media (max-width: 620px) { .vg-items-head { display: none; } .vg-items-row { grid-template-columns: 1fr 1fr; row-gap: 6px; } }

.vg-invoice-doc { padding: 4px 2px; }
.vg-invoice-doc-head { display: flex; align-items: flex-start; justify-content: space-between; padding-bottom: 18px; border-bottom: 1px solid var(--c-border-soft); }
.vg-invoice-doc-meta { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.vg-invoice-doc-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--c-border-soft); }
.vg-invoice-items { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.vg-invoice-items-head { display: grid; grid-template-columns: 2fr 0.6fr 0.9fr 0.9fr; gap: 8px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--c-muted); padding-bottom: 6px; border-bottom: 1px solid var(--c-border-soft); }
.vg-invoice-items-row { display: grid; grid-template-columns: 2fr 0.6fr 0.9fr 0.9fr; gap: 8px; font-size: 13px; padding: 4px 0; }
.vg-invoice-doc-totals { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--c-border-soft); display: flex; flex-direction: column; gap: 8px; }
.vg-invoice-doc-totals > div { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--c-muted-strong); }
.vg-invoice-doc-balance { font-size: 15px !important; color: var(--c-text) !important; font-weight: 700; padding-top: 8px; border-top: 1px dashed var(--c-border); }
.vg-invoice-doc-balance span:last-child { color: var(--c-gold-bright); }

/* ---------- empty state ---------- */
.vg-empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 42px 20px; gap: 6px; }
.vg-empty--tight { padding: 20px; }
.vg-empty-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--c-surface-2); color: var(--c-gold); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
.vg-empty h4 { font-family: 'Fraunces', serif; font-size: 16px; margin: 0; }
.vg-empty p { color: var(--c-muted); font-size: 13px; max-width: 320px; margin: 0 0 8px; }

/* ---------- modal ---------- */
.vg-modal-scrim { position: fixed; inset: 0; background: rgba(6,6,7,0.6); backdrop-filter: blur(3px); display: flex; align-items: flex-start; justify-content: center; z-index: 100; padding: 20px; overflow-y: auto; animation: vg-fade-in 0.18s ease both; }
.vg-modal { width: 100%; background: var(--c-bg-elev); border: 1px solid var(--c-border); border-radius: 16px; box-shadow: var(--shadow-lg); animation: vg-scale-in 0.22s cubic-bezier(.2,.8,.2,1) both; margin: auto 0; }
.vg-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--c-border-soft); background: var(--c-bg-elev); }
.vg-modal-head h3 { font-family: 'Fraunces', serif; font-size: 17px; margin: 0; }
.vg-modal-body { padding: 14px 18px; }

/* compact spacing inside modals so forms fit without internal scrolling */
.vg-modal .vg-form-grid { gap: 10px; }
.vg-modal .vg-field { gap: 4px; }
.vg-modal .vg-field-label { font-size: 10.5px; }
.vg-modal .vg-input, .vg-modal .vg-select { padding: 8px 10px; font-size: 13px; }
.vg-modal .vg-select { padding-right: 28px; }
.vg-modal .vg-filter-chips { gap: 6px; margin-bottom: 8px; }
.vg-modal .vg-filter-chips--tabs { margin-bottom: 4px; }
.vg-modal .vg-chip { padding: 6px 12px; font-size: 12px; }
.vg-modal .vg-items { gap: 6px; }
.vg-modal .vg-pay-balance { padding: 9px 12px; }
.vg-modal .vg-btn { padding: 9px 14px; font-size: 13px; }
.vg-modal .vg-btn--block { margin-top: 2px; }
.vg-modal .vg-form-hint { font-size: 11.5px; margin: -2px 0 0; }

@media (max-width: 640px) {
  .vg-modal-scrim { padding: 8px; }
  .vg-modal-head { padding: 10px 14px; }
  .vg-modal-head h3 { font-size: 15px; }
  .vg-modal-head .vg-icon-btn { width: 28px; height: 28px; }
  .vg-modal-body { padding: 10px 14px; }
  .vg-modal .vg-form-grid { gap: 7px; }
  .vg-modal .vg-field { gap: 3px; }
  .vg-modal .vg-field-label { font-size: 9.5px; }
  .vg-modal .vg-input, .vg-modal .vg-select { padding: 6px 8px; font-size: 12.5px; }
  .vg-modal .vg-filter-chips { gap: 5px; margin-bottom: 5px; }
  .vg-modal .vg-chip { padding: 5px 10px; font-size: 11px; }
  .vg-modal .vg-items { gap: 5px; }
  .vg-modal .vg-items-row { row-gap: 4px; }
  .vg-modal .vg-pay-balance { padding: 7px 10px; font-size: 12.5px; }
  .vg-modal .vg-btn { padding: 7px 12px; font-size: 12.5px; }
  .vg-modal .vg-btn--sm { padding: 5px 10px; font-size: 11.5px; }
  .vg-modal .vg-form-hint { font-size: 10.5px; }
}

/* ---------- toast ---------- */
.vg-toast-stack { position: fixed; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
.vg-toast { display: flex; align-items: center; gap: 9px; background: var(--c-bg-elev); border: 1px solid rgba(78,159,110,0.35); color: var(--c-text); padding: 11px 16px; border-radius: 11px; font-size: 13px; box-shadow: var(--shadow-lg); animation: vg-toast-in 0.25s cubic-bezier(.2,.8,.2,1) both; }
.vg-toast svg { color: var(--c-good); flex-shrink: 0; }

/* ---------- scrollbar ---------- */
* { scrollbar-width: thin; scrollbar-color: var(--c-border) transparent; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 8px; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}
`;

   Mount call added so this runs as a standalone page. Nothing above
   this comment was changed from the original vg-creatives-studio.jsx.
------------------------------------------------------------------ */
import { createRoot } from "react-dom/client";
createRoot(document.getElementById("root")).render(<App />);
</script>
